<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d41f2b">
<title>Inbox · Mikey's Detailing</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap">
<link rel="stylesheet" href="/app/app.css">
<style>
/* Inbox only. The list and the open chat share the screen on a laptop and take
   turns on a phone, so the chat is a fixed panel that slides over the list. */
.ibx{display:grid;gap:10px}
@media (min-width:900px){
  .ibx{grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start}
  .ibx .lst{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto;padding-right:2px}
}
.lst-tools{display:grid;gap:10px;margin-bottom:4px}
.row .preview-out{color:var(--faint)}
.waitpill{font-variant-numeric:tabular-nums}

.chat{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease}
.chat.on{transform:none}
@media (min-width:900px){
  .chat{position:sticky;top:72px;inset:auto;transform:none;height:calc(100vh - 88px);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
  .chat .back{display:none}
}
@media (prefers-reduced-motion:reduce){.chat{transition:none}}
.chat-empty{display:none}
@media (min-width:900px){.chat:not(.on){display:grid;place-items:center}.chat:not(.on) > *{display:none}.chat:not(.on) .chat-empty{display:grid}}
.chat-head{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.chat-head .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;border-radius:10px;cursor:pointer;text-align:left}
.chat-head .who:hover{background:var(--soft)}
.chat-head .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.ctx:empty{display:none}

.tl{flex:1;overflow-y:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
@media (min-width:900px){.tl{background:var(--surface)}}
.daysep{align-self:center;font-size:12px;font-weight:650;color:var(--muted);margin:12px 0 6px;background:var(--soft);padding:3px 10px;border-radius:999px}
.b{max-width:min(78%,520px);padding:9px 12px;border-radius:18px;font-size:15px;line-height:1.38;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.b.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:6px}
.b.out{align-self:flex-end;background:var(--bubble-out);color:var(--bubble-out-ink);border-bottom-right-radius:6px}
.b.auto{align-self:flex-end;background:var(--bubble-auto);color:var(--ink);border-bottom-right-radius:6px}
.b img,.b video{display:block;max-width:240px;max-height:300px;border-radius:12px;margin:2px 0 4px}
.bm{font-size:11.5px;color:var(--muted);margin:0 6px 6px;display:flex;gap:6px;align-items:center}
.bm.r{align-self:flex-end}
.bm .err{color:var(--brand-text);font-weight:650}
.callcard{align-self:stretch;max-width:560px;margin:6px auto;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
@media (min-width:900px){.callcard{background:var(--bg)}}
.callcard .h{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px}
.callcard .h .t{margin-left:auto;font-weight:500;color:var(--muted);font-size:12.5px}
.callcard .tx{font-size:14px;color:var(--ink2);line-height:1.4}
.callcard audio{width:100%;height:36px}
.callcard.missed .h{color:var(--brand-text)}
.sched{align-self:flex-end;max-width:min(78%,520px);border:1px dashed var(--line);border-radius:14px;padding:8px 12px;font-size:14px;color:var(--muted);background:transparent}
.sched b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}

.compose{border-top:1px solid var(--line);background:var(--surface);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.quick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick .chip{height:30px;font-size:12.5px}
.quick .chip.ai{border-color:color-mix(in srgb,var(--brand) 35%,var(--line));color:var(--brand-text)}
.quick .sep{width:1px;background:var(--line);flex:none;margin:4px 2px}
.cbox{display:flex;gap:8px;align-items:flex-end}
.cbox textarea{flex:1;resize:none;max-height:160px;min-height:42px;border:1px solid var(--line);border-radius:21px;padding:10px 14px;background:var(--bg);outline:none;line-height:1.35}
.cbox textarea:focus{border-color:var(--brand)}
.sendbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.sendbtn[disabled]{opacity:.4}
.note{font-size:12.5px;color:var(--warn);padding:0 6px 6px}
.optout{padding:12px;text-align:center;color:var(--brand-text);font-weight:600;font-size:14px}
.ask{margin:4px 0 8px;padding:10px 12px;border-radius:12px;background:var(--info-soft);color:var(--ink);font-size:14px;display:grid;gap:8px}
.ask .chips{flex-wrap:wrap}
.opts{display:grid;gap:8px}
.opts .btn{justify-content:flex-start;height:auto;min-height:44px;padding:10px 14px;white-space:normal;text-align:left}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
</style>
</head>
<body>
<script src="/app/app.js"></script>
<script>
(function(){
"use strict";
var A = window.App, esc = A.esc, icon = A.icon, el = A.el;
A.frame("inbox", "Inbox", '<button class="iconbtn" id="newBtn" title="New message" aria-label="New message">'+icon("msg")+'</button>');

var S = { rows:[], calls:[], filter:"all", q:"", phone:null, thread:null, cfg:{}, loaded:false, sending:false, aiOriginal:"" };
var REVIEW_FALLBACK = "https://g.page/r/CRCuKQ982VIZEBE/review";
var AUTO_KINDS = { scheduled:1, auto:1, followup:1, "missed-call":1, booking:1, pay:1, assist:1 };
var VAN_RE = /\b(van|minivan|3-row|three.row|odyssey|sienna|pacifica|caravan|carnival|transit|sprinter|promaster|suburban|expedition|yukon xl|sequoia|navigator|escalade esv)\b/i;
var SUV_RE = /\b(suv|truck|pickup|tacoma|tundra|f-?150|f-?250|f-?350|f-?450|silverado|sierra|ram|ranger|colorado|canyon|frontier|titan|ridgeline|maverick|gladiator|tahoe|yukon|explorer|4runner|highlander|rav-?4|cr-?v|pilot|passport|wrangler|jeep|bronco|escape|edge|equinox|traverse|blazer|outback|forester|ascent|rogue|pathfinder|murano|cx-?5|cx-?9|cx-?50|tucson|santa fe|palisade|sorento|telluride|sportage|cherokee|durango|grand cherokee|x3|x5|q5|q7|gx|rx|model y|wagoneer|4x4)\b/i;

el("view").innerHTML =
  '<div class="ibx">'+
    '<section class="lst" aria-label="Conversations">'+
      '<div class="lst-tools">'+
        '<label class="search">'+icon("search")+'<input class="input" id="q" type="search" placeholder="Search name, number, car, town" aria-label="Search"></label>'+
        '<div class="chips" id="filters" role="tablist"></div>'+
      '</div>'+
      '<div id="list"><div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>'+
    '</section>'+
    '<section class="chat" id="chat" aria-label="Conversation">'+
      '<div class="chat-empty empty"><b>Pick a conversation</b><span>The people waiting on you are at the top.</span></div>'+
      '<div class="chat-head">'+
        '<button class="iconbtn back" id="backBtn" aria-label="Back">'+icon("back")+'</button>'+
        '<button class="who" id="whoBtn" aria-label="Customer details"><span id="chatAv"></span><span style="min-width:0"><div class="nm" id="chatName"></div><div class="meta" id="chatMeta"></div></span></button>'+
        '<button class="iconbtn" id="callBtn" title="Call" aria-label="Call">'+icon("phone")+'</button>'+
        '<button class="iconbtn" id="doneBtn" title="Done" aria-label="Mark done">'+icon("check")+'</button>'+
      '</div>'+
      '<div class="ctx" id="ctx"></div>'+
      '<div class="tl" id="tl" aria-live="polite"></div>'+
      '<div class="compose" id="compose">'+
        '<div id="askBox"></div>'+
        '<div class="note" id="note" hidden></div>'+
        '<div class="quick" id="quick">'+
          '<button class="chip ai" data-q="draft">'+icon("sparkles")+'Draft</button>'+
          '<button class="chip ai" data-q="polish">'+icon("sparkles")+'Polish</button>'+
          '<button class="chip ai" data-q="spell">'+icon("spell")+'Spelling</button>'+
          '<span class="sep"></span>'+
          '<button class="chip" data-q="times">'+icon("calendar")+'Next 3 times</button>'+
          '<button class="chip" data-q="omw">'+icon("route")+'On my way</button>'+
          '<button class="chip" data-q="addr">'+icon("pin")+'Address?</button>'+
          '<button class="chip" data-q="review">'+icon("star")+'Review link</button>'+
        '</div>'+
        '<div class="cbox"><textarea id="msg" rows="1" placeholder="Text message" aria-label="Message"></textarea>'+
          '<button class="sendbtn" id="sendBtn" aria-label="Send" disabled>'+icon("send")+'</button></div>'+
      '</div>'+
    '</section>'+
  '</div>';

// ---- list -------------------------------------------------------------
function matches(r){
  if (!S.q) return true;
  var hay = [r.name, r.phone, A.fmtPhone(r.phone), r.vehicleLabel, r.city, r.lastBody].join(" ").toLowerCase();
  return hay.indexOf(S.q) >= 0;
}
function rowHtml(r, waiting){
  var unread = r.unread && r.lastDir === "in";
  var tags = [];
  if (waiting && r.waitSince) tags.push('<span class="pill red waitpill">'+icon("clock")+'Waiting '+A.ago(r.waitSince)+'</span>');
  if (r.hasVoicemail) tags.push('<span class="pill amber">'+icon("voicemail")+'Voicemail</span>');
  if (r.appointmentAt && r.appointmentAt > Date.now() - A.DAY) tags.push('<span class="pill green">'+icon("calendar")+esc(A.dayLabel(r.appointmentAt).replace(/,.*$/,""))+' '+esc(A.clock(r.appointmentAt))+'</span>');
  else if (r.quoteTotal) tags.push('<span class="pill">'+esc(A.money(r.quoteTotal))+' quoted</span>');
  if (r.plan) tags.push('<span class="pill blue">Clean Club</span>');
  if (r.optedOut) tags.push('<span class="pill red">Do not text</span>');
  var preview = (r.lastDir === "out" ? '<span class="preview-out">You: </span>' : '') + esc(r.lastBody || "");
  var sub2 = [r.vehicleLabel, r.city].filter(Boolean).join(" · ");
  return '<button class="row'+(unread?' unread':'')+(r.phone===S.phone?' sel':'')+'" data-phone="'+esc(r.phone)+'">'+
    A.avatar(r, false, unread)+
    '<span class="main"><span class="top"><span class="name">'+esc(A.displayName(r))+'</span><span class="when">'+esc(A.when(r.lastTs))+'</span></span>'+
    '<span class="sub">'+preview+'</span>'+
    (sub2 ? '<span class="sub" style="font-size:12.5px">'+esc(sub2)+'</span>' : '')+
    (tags.length ? '<span class="tags">'+tags.join('')+'</span>' : '')+
    '</span></button>';
}
function renderList(){
  var live = S.rows.filter(function(r){ return !r.archived; });
  var waiting = A.needsYou(S.rows);
  var wset = {}; waiting.forEach(function(r){ wset[r.phone] = 1; });
  var done = S.rows.filter(function(r){ return r.archived; });
  el("filters").innerHTML = [["all","All",live.length],["waiting","Needs you",waiting.length],["done","Done",done.length]].map(function(f){
    return '<button class="chip'+(S.filter===f[0]?' on':'')+'" data-f="'+f[0]+'" role="tab" aria-selected="'+(S.filter===f[0])+'">'+f[1]+' <span class="n">'+f[2]+'</span></button>';
  }).join('');
  var h = '';
  if (!S.loaded) return;
  if (S.filter === "done") {
    var d = done.filter(matches);
    h = d.length ? '<div class="list">'+d.map(function(r){ return rowHtml(r,false); }).join('')+'</div>' : '<div class="empty"><b>Nothing filed yet</b><span>Tap the check in a chat to file it here.</span></div>';
  } else {
    var w = waiting.filter(matches);
    var rest = live.filter(function(r){ return !wset[r.phone] && matches(r); });
    if (S.filter === "waiting") rest = [];
    if (w.length) h += '<div class="section-label">Needs you <span class="count">'+w.length+'</span></div><div class="list">'+w.map(function(r){ return rowHtml(r,true); }).join('')+'</div>';
    else if (!S.q) h += '<div class="section-label calm">Needs you <span class="count">0</span></div><div class="card empty" style="padding:18px"><b>You\'re all caught up</b></div>';
    if (rest.length) h += '<div class="section-label calm">Everyone else</div><div class="list">'+rest.map(function(r){ return rowHtml(r,false); }).join('')+'</div>';
    if (!w.length && !rest.length && S.q) h = '<div class="empty"><b>No one matches "'+esc(S.q)+'"</b></div>';
  }
  el("list").innerHTML = h;
}
function loadList(){
  return A.api("/api/threads").then(function(d){
    if (!d || !d.ok) return;
    S.rows = d.threads || []; S.loaded = true; renderList();
  });
}
function loadCalls(){
  return A.api("/api/calls").then(function(d){ if (d && d.ok) { S.calls = d.calls || []; if (S.thread) renderThread(); } });
}

el("filters").addEventListener("click", function(e){ var b = e.target.closest("[data-f]"); if (!b) return; S.filter = b.dataset.f; renderList(); });
el("q").addEventListener("input", function(){ S.q = this.value.trim().toLowerCase(); renderList(); });
el("list").addEventListener("click", function(e){ var b = e.target.closest("[data-phone]"); if (b) openChat(b.dataset.phone, true); });

// ---- chat -------------------------------------------------------------
function rowFor(phone){ for (var i=0;i<S.rows.length;i++) if (S.rows[i].phone === phone) return S.rows[i]; return null; }
function openChat(phone, push){
  S.phone = phone; S.thread = null; S.aiOriginal = "";
  el("msg").value = ""; sizeBox(); el("note").hidden = true; el("askBox").innerHTML = "";
  el("chat").classList.add("on");
  var r = rowFor(phone) || { phone:phone };
  paintHead(r);
  el("ctx").innerHTML = ""; el("tl").innerHTML = '<div class="empty">Loading…</div>';
  if (push) { try { history.pushState({ c:phone }, "", "/inbox?c=" + encodeURIComponent(phone)); } catch(e){} }
  renderList();
  loadThread();
}
function closeChat(){
  S.phone = null; S.thread = null;
  el("chat").classList.remove("on");
  renderList();
}
function loadThread(){
  var phone = S.phone; if (!phone) return Promise.resolve();
  // peek=1: looking doesn't mark it read. It stays in Needs you until he
  // answers or files it (his rule, 2026-10-08).
  return A.api("/api/thread?peek=1&phone=" + encodeURIComponent(phone)).then(function(d){
    if (phone !== S.phone || !d || !d.ok) return;
    S.thread = d.thread || { phone:phone, messages:[] };
    paintHead(Object.assign({}, rowFor(phone) || {}, S.thread));
    renderThread();
  });
}
function paintHead(r){
  el("chatAv").innerHTML = A.avatar(r, true);
  el("chatName").textContent = A.displayName(r);
  var g = r.garage || {};
  var car = r.vehicleLabel || ((g.vehicles && g.vehicles[0]) ? [g.vehicles[0].year, g.vehicles[0].make, g.vehicles[0].model].filter(Boolean).join(" ") : "");
  el("chatMeta").textContent = [car, r.city || g.city, r.name ? A.fmtPhone(r.phone) : ""].filter(Boolean).join(" · ") || "Tap for details";
}
function timeline(t){
  var items = [];
  (t.messages || []).forEach(function(m){ items.push({ ts:m.ts, m:m }); });
  // Answered and missed calls live in the call log, not the thread. Voicemails
  // are already messages, so they're left out here or they'd show twice.
  S.calls.forEach(function(c){
    if (c.fromNorm !== t.phone) return;
    if (c.outcome === "answered" || c.outcome === "missed" || c.outcome === "past") items.push({ ts:c.ts, call:c });
  });
  items.sort(function(a,b){ return a.ts - b.ts; });
  return items;
}
function mediaHtml(list){
  return (list || []).map(function(mm){
    var u = String(mm && mm.url || mm || "");
    var src = /^data:|^\/i\//.test(u) ? u : "/api/media?u=" + encodeURIComponent(u);
    if (/^video\//.test(mm.type || "")) return '<video src="'+esc(src)+'" controls preload="metadata"></video>';
    return '<a href="'+esc(src)+'" target="_blank" rel="noopener"><img src="'+esc(src)+'" loading="lazy" alt="Photo"></a>';
  }).join('');
}
function callCard(c, vm){
  var kind = vm ? "voicemail" : c.outcome;
  var label = kind === "voicemail" ? "Voicemail" : kind === "missed" ? "Missed call" : kind === "answered" ? "Call" : "Call";
  var ic = kind === "voicemail" ? "voicemail" : kind === "missed" ? "phoneMissed" : "phone";
  var secs = vm ? (String(c.body||"").match(/\((\d+)s\)/) || [])[1] : (c.talkSec || c.vmSec);
  var tx = c.transcript ? esc(c.transcript) : (c.transcriptFailed ? '<i>No transcript for this one.</i>' : '');
  return '<div class="callcard'+(kind==="missed"?' missed':'')+'"><div class="h">'+icon(ic)+label+(secs?' · '+secs+'s':'')+'<span class="t">'+esc(A.clock(c.ts))+'</span></div>'+
    (tx ? '<div class="tx">'+tx+'</div>' : '')+
    (c.recording ? '<audio controls preload="none" src="/api/media?u='+esc(encodeURIComponent(c.recording))+'"></audio>' : '')+
    '</div>';
}
function renderThread(){
  var t = S.thread; if (!t) return;
  var r = rowFor(t.phone) || {};
  // context: what's true of this customer right now, one line each
  var ctx = [];
  if (t.appointmentAt && t.appointmentAt > Date.now() - A.DAY) ctx.push('<span class="pill green">'+icon("calendar")+'Booked '+esc(A.dayLabel(t.appointmentAt))+' '+esc(A.clock(t.appointmentAt))+'</span>');
  if (r.quoteTotal) ctx.push('<span class="pill">'+icon("dollar")+esc(A.money(r.quoteTotal))+' quoted</span>');
  if (t.plan) ctx.push('<span class="pill blue">Clean Club · every '+Math.round((t.plan.every||56)/7)+' wks</span>');
  if (r.waitSince && (r.awaitingReply)) ctx.push('<span class="pill red">'+icon("clock")+'Waiting '+A.ago(r.waitSince)+'</span>');
  el("ctx").innerHTML = ctx.join('');

  var h = '', lastDay = -1;
  timeline(t).forEach(function(it){
    var day = A.startOfDay(it.ts);
    if (day !== lastDay) { h += '<div class="daysep">'+esc(A.dayLabel(it.ts))+'</div>'; lastDay = day; }
    if (it.call) { h += callCard(it.call); return; }
    var m = it.m;
    if (m.kind === "voicemail" || m.kind === "call") { h += callCard(m, m.kind === "voicemail"); return; }
    var auto = m.dir === "out" && AUTO_KINDS[m.kind];
    var cls = m.dir === "in" ? "in" : (auto ? "auto" : "out");
    var body = esc(m.body || "");
    h += '<div class="b '+cls+'">'+mediaHtml(m.media)+body+'</div>';
    var meta = [esc(A.clock(m.ts))];
    if (auto) meta.push("Auto");
    if (m.by) meta.push(esc(m.by));
    if (m.status === "failed" || m.status === "undelivered" || m.error) meta.push('<span class="err">Not delivered</span>');
    h += '<div class="bm'+(m.dir==="out"?' r':'')+'">'+meta.join(' · ')+'</div>';
  });
  (t.scheduled || []).forEach(function(s){
    h += '<div class="sched"><b>Scheduled · '+esc(A.dayLabel(s.sendAt))+' '+esc(A.clock(s.sendAt))+'</b>'+esc(s.body || "")+'</div>';
  });
  if (!h) h = '<div class="empty">No messages yet. Say hi.</div>';
  var tl = el("tl"), atBottom = tl.scrollHeight - tl.scrollTop - tl.clientHeight < 80;
  var first = !tl.dataset.phone || tl.dataset.phone !== t.phone;
  tl.innerHTML = h; tl.dataset.phone = t.phone;
  if (first || atBottom) tl.scrollTop = tl.scrollHeight;
  var opted = r.optedOut || t.optedOut;
  el("compose").querySelector(".cbox").hidden = !!opted;
  el("quick").hidden = !!opted;
  var oo = el("optoutMsg");
  if (opted && !oo) el("compose").insertAdjacentHTML("afterbegin", '<div class="optout" id="optoutMsg">They texted STOP. You can\'t text this number.</div>');
  if (!opted && oo) oo.remove();
}

el("backBtn").addEventListener("click", function(){ if (history.state && history.state.c) history.back(); else closeChat(); });
window.addEventListener("popstate", function(){
  var m = location.search.match(/[?&]c=([^&#]+)/);
  if (m) openChat(decodeURIComponent(m[1]), false); else closeChat();
});
el("whoBtn").addEventListener("click", function(){ if (S.phone) A.customerSheet(S.phone, { onSaved:function(){ loadList(); loadThread(); } }); });
el("callBtn").addEventListener("click", function(){
  if (!S.phone) return;
  A.post("/api/call", { phone:S.phone }).then(function(d){
    A.toast(d && d.ok ? "Calling your phone. Pick up and it connects them." : "Couldn't start the call.");
  });
});
el("doneBtn").addEventListener("click", function(){
  var phone = S.phone; if (!phone) return;
  Promise.all([A.post("/api/meta", { phone:phone, archived:true }), A.post("/api/read", { phone:phone })]).then(function(){
    var r = rowFor(phone); if (r) { r.archived = true; r.unread = 0; r.awaitingReply = false; }
    if (history.state && history.state.c) history.back(); else closeChat();
    A.toast("Filed in Done");
    loadList();
  });
});

// ---- compose ------------------------------------------------------------
var box = el("msg");
function sizeBox(){ box.style.height = "auto"; box.style.height = Math.min(160, box.scrollHeight + 2) + "px"; el("sendBtn").disabled = !box.value.trim() || S.sending; }
box.addEventListener("input", sizeBox);
box.addEventListener("keydown", function(e){ if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); } });
function setText(t, fromAi){
  box.value = t; sizeBox(); box.focus();
  if (fromAi) S.aiOriginal = t;
}
function insert(t){
  var v = box.value.trim();
  setText(v ? v + (/[.!?]$/.test(v) ? " " : ". ") + t : t);
}
function send(){
  var body = box.value.trim(), phone = S.phone;
  if (!body || !phone || S.sending) return;
  S.sending = true; sizeBox();
  var payload = { phone:phone, body:body };
  if (S.aiOriginal) payload.aiOriginal = S.aiOriginal;
  A.post("/api/send", payload).then(function(d){
    S.sending = false;
    if (!d || !d.ok) { sizeBox(); A.toast(d && d.error === "recipient_opted_out" ? "They opted out. It wasn't sent." : "Didn't send. Check your signal and try again."); return; }
    box.value = ""; S.aiOriginal = ""; el("note").hidden = true; sizeBox();
    // Answering is what clears it (his rule). The server doesn't do this on a
    // send, so the page does.
    A.post("/api/read", { phone:phone });
    if (d.thread && phone === S.phone) { S.thread = d.thread; renderThread(); }
    var r = rowFor(phone); if (r) { r.unread = 0; r.awaitingReply = false; r.lastDir = "out"; r.lastBody = body; r.lastTs = Date.now(); }
    renderList();
    setTimeout(loadList, 1500);
  });
}
el("sendBtn").addEventListener("click", send);

function busy(btn, on){ if (!btn) return; btn.disabled = on; btn.style.opacity = on ? ".55" : ""; }
function ai(kind, btn, hint){
  var phone = S.phone; if (!phone) return;
  var text = box.value.trim();
  if ((kind === "polish" || kind === "spell") && !text) { A.toast("Type something first."); return; }
  var body = { phone:phone };
  if (kind === "polish") body.text = text;
  if (kind === "spell") { body.text = text; body.spell = true; }
  if (hint) body.hint = hint;
  busy(btn, true);
  A.post("/api/ai/draft", body).then(function(d){
    busy(btn, false);
    if (phone !== S.phone) return;
    if (!d || !d.ok) { A.toast("The AI didn't answer. Try again in a minute."); return; }
    if (d.needsYou && d.needsYou.question) { showAsk(d.needsYou); return; }
    if (typeof d.draft === "string" && d.draft) {
      if (kind === "spell" && d.draft === text) { A.toast("No spelling fixes needed."); return; }
      setText(d.draft, kind === "draft");
      var n = el("note"); n.textContent = d.note || ""; n.hidden = !d.note;
    }
  });
}
// When the AI can't write it without a fact only Mikey has (a price, a day),
// it asks him instead of guessing. Picking an answer writes the text with it.
function showAsk(q){
  el("askBox").innerHTML = '<div class="ask"><div><b>Quick question:</b> '+esc(q.question)+'</div><div class="chips">'+
    (q.options || []).map(function(o, i){ return '<button class="chip" data-opt="'+i+'">'+esc(o)+'</button>'; }).join('')+
    '<button class="chip" data-opt="x">Skip</button></div></div>';
  el("askBox").onclick = function(e){
    var b = e.target.closest("[data-opt]"); if (!b) return;
    el("askBox").innerHTML = "";
    if (b.dataset.opt !== "x") ai("draft", null, (q.options || [])[+b.dataset.opt]);
  };
}

function quickTimes(){
  var r = rowFor(S.phone) || {}, q = (S.thread && S.thread.quote) || {};
  var svc = /full/i.test(q.service || r.lastBody || "") ? "full" : /exterior/i.test(q.service || "") ? "exterior" : /interior/i.test(q.service || "") ? "interior" : "full";
  // A best guess from the car's name so the sheet opens on the right size; he
  // can tap another. The price book's sizes: sedan, SUV or pickup, van or 3-row.
  var g = (S.thread && S.thread.garage && S.thread.garage.vehicles && S.thread.garage.vehicles[0]) || {};
  var car = [q.size, r.vehicleLabel, g.make, g.model].join(" ");
  var size = VAN_RE.test(car) ? "truck" : SUV_RE.test(car) ? "suv" : "sedan";
  var p = A.sheet('<h2>Next 3 open times</h2>'+
    '<div class="section-label" style="margin-top:0">Service</div><div class="seg" id="svcSeg">'+[["exterior","Exterior"],["interior","Interior"],["full","Full Detail"]].map(function(x){ return '<button class="chip'+(x[0]===svc?' on':'')+'" data-v="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div>'+
    '<div class="section-label">Vehicle</div><div class="seg" id="sizeSeg">'+[["sedan","Car / sedan"],["suv","SUV / pickup"],["truck","Van / 3-row"]].map(function(x){ return '<button class="chip'+(x[0]===size?' on':'')+'" data-v="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div>'+
    '<div id="slots" class="opts"><div class="empty">Checking your calendar…</div></div>');
  function load(){
    el("slots").innerHTML = '<div class="empty">Checking your calendar…</div>';
    fetch("/api/next-openings?n=3&service=" + svc + "&size=" + size).then(function(r){ return r.json(); }).then(function(d){
      var o = (d && d.openings) || [];
      if (!o.length) { el("slots").innerHTML = '<div class="empty"><b>No openings in the next few weeks</b><span>Your calendar is full or blocked.</span></div>'; return; }
      var list = o.map(function(x){ return x.label + " at " + x.time; });
      var text = list.length === 1 ? "I have " + list[0] + " open. Would that work for you?"
        : "I have " + list.slice(0, -1).join(", ") + (list.length > 2 ? "," : "") + " or " + list[list.length-1] + " open. Would any of those work for you?";
      el("slots").innerHTML = o.map(function(x){ return '<div class="pill green" style="justify-self:start">'+esc(x.label)+' · '+esc(x.time)+'</div>'; }).join('')+
        '<button class="btn primary" id="useTimes">Put these in my text</button>';
      el("useTimes").onclick = function(){ A.closeSheet(); insert(text); };
    }).catch(function(){ el("slots").innerHTML = '<div class="empty">Couldn\'t reach the calendar.</div>'; });
  }
  p.addEventListener("click", function(e){
    var b = e.target.closest(".seg .chip"); if (!b) return;
    var seg = b.parentNode; seg.querySelectorAll(".chip").forEach(function(c){ c.classList.toggle("on", c === b); });
    if (seg.id === "svcSeg") svc = b.dataset.v; else size = b.dataset.v;
    load();
  });
  load();
}
function quickOmw(){
  // His own words from his texts: "Be there in 20!", "ETA is 12:05".
  var p = A.sheet('<h2>On my way</h2><div class="opts">'+[10,15,20,30,45].map(function(n){
    return '<button class="btn" data-t="Be there in '+n+'!">Be there in '+n+'!</button>';
  }).join('')+'<button class="btn" data-eta="1">ETA is …</button></div>');
  p.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    A.closeSheet();
    if (b.dataset.eta) { var t = new Date(Date.now() + 25*60000); t.setMinutes(Math.round(t.getMinutes()/5)*5); setText("ETA is " + A.clock(t.getTime()).replace(" "," ")); }
    else setText(b.dataset.t);
  });
}
el("quick").addEventListener("click", function(e){
  var b = e.target.closest("[data-q]"); if (!b) return;
  var q = b.dataset.q;
  if (q === "draft" || q === "polish" || q === "spell") return ai(q, b);
  if (q === "times") return quickTimes();
  if (q === "omw") return quickOmw();
  if (q === "addr") return insert("Any chance I can get your address or general street area?");
  if (q === "review") return insert("Here's that review link: " + (S.cfg.reviewUrl || REVIEW_FALLBACK));
});

// ---- new message ----------------------------------------------------------
el("newBtn").addEventListener("click", function(){
  var p = A.sheet('<h2>New message</h2><div style="display:grid;gap:10px">'+
    '<input class="input" id="nmPhone" type="tel" inputmode="tel" placeholder="Phone number" aria-label="Phone number">'+
    '<textarea class="textarea" id="nmBody" rows="4" placeholder="Message" aria-label="Message"></textarea>'+
    '<button class="btn primary" id="nmSend">Send</button></div>');
  el("nmPhone").focus();
  el("nmSend").onclick = function(){
    var ph = el("nmPhone").value.trim(), body = el("nmBody").value.trim();
    var digits = ph.replace(/\D/g, "");
    if (digits.length < 10) { A.toast("That number looks short."); return; }
    if (!body) { A.toast("Write the message first."); return; }
    var e164 = digits.length === 10 ? "+1" + digits : "+" + digits;
    this.disabled = true;
    A.post("/api/send", { phone:e164, body:body }).then(function(d){
      if (!d || !d.ok) { el("nmSend").disabled = false; A.toast("Didn't send."); return; }
      A.closeSheet(); loadList().then(function(){ openChat(e164, true); });
    });
  };
});

// ---- start ---------------------------------------------------------------
A.api("/api/config").then(function(d){ if (d && d.ok !== false) S.cfg = d.config || d || {}; });
Promise.all([loadList(), loadCalls()]).then(function(){
  var m = location.search.match(/[?&]c=([^&#]+)/);
  if (m) { var ph = decodeURIComponent(m[1]); try { history.replaceState({ c:ph }, "", location.href); } catch(e){} openChat(ph, false); }
  else if (/[?&]waiting=1/.test(location.search)) { S.filter = "waiting"; renderList(); }
});
// Fresh without a refresh: the list every 20 seconds, an open chat every 8.
// Both are reads of the list row and a peek, so they cost no KV writes.
setInterval(function(){ if (!document.hidden) loadList(); }, 20000);
setInterval(function(){ if (!document.hidden && S.phone) loadThread(); }, 8000);
setInterval(function(){ if (!document.hidden) loadCalls(); }, 60000);
})();
</script>
