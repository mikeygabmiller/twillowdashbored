<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<title>Texting for Mikey</title>
<link rel="icon" href="/favicon.svg">
<style>
  /* The helper's whole world: who's waiting, the conversation, a reply box, and
     the guide. Deliberately nothing else. Everything a helper could break or
     shouldn't see (money, settings, bookings, automations) lives in the main
     app, and the Worker refuses those routes to this PIN anyway. Same palette
     as bookings.html so it reads as part of the same product. */
  :root{
    --bg:#0c0c0e; --card:#17171b; --card2:#1f1f25; --line:#2a2a31; --line2:#37373f;
    --txt:#f4f4f6; --muted:#a2a2ac; --faint:#71717a;
    --red:#ff2d3f; --amber:#f5a524; --green:#2fd07a; --blue:#4c9ffe; --purple:#9b7bff;
    --me:#1d3b5f; --them:#1f1f25;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  .hide{display:none!important}
  header{position:sticky;top:0;z-index:20;background:rgba(12,12,14,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hin{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .ttl{font-weight:800;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
  .hbtn{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
  .hbtn.on{background:var(--txt);color:var(--bg)}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
  .banner{max-width:720px;margin:10px auto 0;padding:10px 14px;border-radius:12px;background:#221a08;border:1px solid #5b4410;color:#f7d58b;font-size:14px}
  .banner a{color:#fff}

  /* ---- sign in ---- */
  .login{max-width:340px;margin:18vh auto 0;padding:0 16px;text-align:center}
  .login h1{font-size:22px;margin:0 0 6px}
  .login p{color:var(--muted);margin:0 0 18px}
  .login input{width:100%;font-size:26px;letter-spacing:8px;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--txt)}
  .login button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--red);font-weight:700;font-size:16px}
  .err{color:var(--red);min-height:22px;margin-top:10px;font-size:14px}

  /* ---- inbox ---- */
  .search{width:100%;margin:14px 0 4px;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--txt);font-size:16px}
  .sec{margin:18px 0 8px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
  .sec.hot{color:var(--red)}
  .row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .row.wait{border-color:#5a1a22;background:#1b1114}
  .row .who{font-weight:700}
  .row .sub{color:var(--muted);font-size:13px}
  .row .last{color:var(--txt);opacity:.85;font-size:14px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row .mid{flex:1;min-width:0}
  .row .age{font-size:12px;color:var(--muted);white-space:nowrap}
  .row.wait .age{color:var(--red);font-weight:700}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin:4px 4px 0 0}
  .tag.date{background:rgba(245,165,36,.16);color:var(--amber)}
  .tag.ask{background:rgba(155,123,255,.16);color:var(--purple)}
  .tag.stop{background:rgba(255,45,63,.16);color:var(--red)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:7px;flex:none}
  .dot.off{visibility:hidden}
  .empty{color:var(--muted);text-align:center;padding:26px 10px;background:var(--card);border-radius:14px;border:1px dashed var(--line2)}

  /* ---- conversation ---- */
  .info{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:14px;color:var(--muted);white-space:pre-wrap}
  .info b{color:var(--txt)}
  .info .line{margin:2px 0}
  .msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:10px}
  .b{max-width:82%;padding:9px 12px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
  .b.in{align-self:flex-start;background:var(--them);border-bottom-left-radius:5px}
  .b.out{align-self:flex-end;background:var(--me);border-bottom-right-radius:5px}
  .b .t{display:block;font-size:11px;color:var(--muted);margin-top:4px}
  .day{align-self:center;font-size:12px;color:var(--faint);margin:8px 0 2px}
  .sugg{background:#15122a;border:1px solid #3a2f73;border-radius:14px;padding:11px 13px;margin:6px 0 10px}
  .sugg .h{font-size:12px;font-weight:700;color:var(--purple);margin-bottom:4px}
  .sugg .x{white-space:pre-wrap;font-size:15px}
  .sugg button{margin-top:8px}
  .composer{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(12,12,14,0),var(--bg) 14px);padding:14px 0 max(12px,env(safe-area-inset-bottom))}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--card2);border:1px solid var(--line2);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
  textarea{width:100%;min-height:74px;max-height:40vh;resize:vertical;padding:11px 13px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--txt);font:inherit;font-size:16px}
  textarea:focus{outline:none;border-color:var(--blue)}
  .strip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-height:26px;margin:6px 2px 0}
  .strip.pol{color:#cdbfff}
  .strip.warn{color:var(--amber)}
  .strip button{background:none;border:0;color:var(--blue);font-weight:700;padding:2px 4px}
  .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .btn{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
  .btn.go{background:var(--blue);border-color:var(--blue);color:#fff;margin-left:auto;padding:10px 22px}
  .btn.go:disabled{opacity:.5}
  .btn.mk{border-color:#5b4410;color:#f7d58b}

  /* ---- guide ---- */
  .g h2{font-size:17px;margin:22px 0 8px}
  .g ul{margin:0;padding-left:20px}
  .g li{margin:6px 0}
  .notes{background:#0f2016;border:1px solid #1f5234;border-radius:14px;padding:12px 14px;margin-top:14px;white-space:pre-wrap}
  .notes b{display:block;color:var(--green);font-size:13px;margin-bottom:4px}
  table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border-radius:12px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px}
  td.n{white-space:nowrap}
  .q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
  .q b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;max-width:90vw}
</style>
</head>
<body>
<header id="hdr" class="hide">
  <div class="hin">
    <button class="hbtn hide" id="backBtn" aria-label="Back">&larr;</button>
    <div class="ttl" id="ttl">Texting for Mikey</div>
    <button class="hbtn" id="guideBtn">Guide</button>
    <button class="hbtn" id="outBtn">Sign out</button>
  </div>
</header>
<div class="banner hide" id="ownerBanner">This is what your helper sees. <a href="/">Back to your app</a></div>

<div class="login hide" id="loginView">
  <h1>Texting for Mikey</h1>
  <p>Enter your PIN</p>
  <input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password" maxlength="64">
  <button id="pinGo">Sign in</button>
  <div class="err" id="pinErr"></div>
</div>

<div class="wrap hide" id="inboxView">
  <input class="search" id="q" type="search" placeholder="Search name, number or text">
  <div id="inboxList"></div>
</div>

<div class="wrap hide" id="chatView">
  <div id="chatInfo"></div>
  <div class="msgs" id="msgs"></div>
  <div id="sugg"></div>
  <div class="composer">
    <div class="chips" id="chips"></div>
    <textarea id="box" placeholder="Type your reply. Auto Polish makes it sound like Mikey when you pause."></textarea>
    <div class="strip" id="strip"></div>
    <div class="acts">
      <button class="btn mk" id="askDate">Ask Mikey for a date</button>
      <button class="btn mk" id="askQ">Ask Mikey</button>
      <button class="btn go" id="sendBtn">Send</button>
    </div>
  </div>
</div>

<div class="wrap g hide" id="guideView"></div>

<script>
(function(){
  "use strict";
  var TZ="America/Los_Angeles";
  var S={role:"",name:"",threads:[],phone:"",thread:null,guide:null,view:"",q:""};
  // Auto Polish state. `ok` is the exact text that has been through polish (or
  // that the helper deliberately kept with Undo) — Send only goes out when the
  // box still matches it, which is how every text gets a voice check without a
  // second button to remember.
  var P={timer:null,busy:false,ok:"",before:"",failed:false,seq:0};
  var IDLE=2400, MIN=10;

  function el(id){return document.getElementById(id)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
  function api(path,opts){
    return fetch(path,Object.assign({credentials:"same-origin"},opts||{})).then(function(r){
      if(r.status===401){showLogin();return{ok:false,unauthorized:true}}
      return r.json().catch(function(){return{ok:false}});
    });
  }
  function post(path,body){return api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})}
  function ago(ts){
    var m=Math.max(0,Math.round((Date.now()-ts)/60000));
    if(m<1)return"just now";if(m<60)return m+"m";var h=Math.round(m/60);if(h<48)return h+"h";return Math.round(h/24)+"d";
  }
  function fmtPhone(p){var d=String(p||"").replace(/\D/g,"");if(d.length===11&&d[0]==="1")d=d.slice(1);return d.length===10?"("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6):String(p||"")}
  function who(t){return(t&&t.name)||fmtPhone(t&&t.phone)}
  function when(ts){try{return new Date(ts).toLocaleString("en-US",{timeZone:TZ,weekday:"short",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){return new Date(ts).toLocaleString()}}
  function dayKey(ts){try{return new Date(ts).toLocaleDateString("en-US",{timeZone:TZ,weekday:"long",month:"short",day:"numeric"})}catch(e){return""}}

  function show(v){
    S.view=v;
    ["loginView","inboxView","chatView","guideView"].forEach(function(id){el(id).classList.toggle("hide",id!==v+"View")});
    el("hdr").classList.toggle("hide",v==="login");
    el("backBtn").classList.toggle("hide",v==="inbox");
    el("guideBtn").classList.toggle("on",v==="guide");
    el("ownerBanner").classList.toggle("hide",!(S.role==="owner"&&v!=="login"));
    if(v==="inbox")el("ttl").innerHTML="Texting for Mikey"+(S.name?"<small>Signed in as "+esc(S.name)+"</small>":"");
    if(v==="guide")el("ttl").textContent="How to text for Mikey";
    window.scrollTo(0,0);
  }

  // ---- sign in ----
  function showLogin(){show("login");setTimeout(function(){el("pinIn").focus()},50)}
  function doLogin(){
    var v=el("pinIn").value.trim();if(!v)return;
    el("pinErr").textContent="";
    post("/api/login",{password:v}).then(function(d){
      if(d&&d.ok){el("pinIn").value="";boot();return}
      el("pinErr").textContent=d&&d.error==="locked"?"Too many wrong tries. Wait "+(d.minutes||15)+" min.":"Wrong PIN, try again";
      el("pinIn").select();
    }).catch(function(){el("pinErr").textContent="No connection, try again"});
  }
  el("pinGo").onclick=doLogin;
  el("pinIn").onkeydown=function(e){if(e.key==="Enter")doLogin()};
  el("outBtn").onclick=function(){post("/api/logout").then(function(){S.role="";showLogin()})};

  function boot(){
    api("/api/whoami").then(function(d){
      if(!d||!d.ok)return;
      S.role=d.role;S.name=d.name||"";
      api("/api/helper/guide").then(function(g){if(g&&g.ok){S.guide=g;if(!S.name)S.name=g.name||"";renderChips();if(S.view==="guide")renderGuide();if(S.view==="inbox")show("inbox")}});
      var c=new URLSearchParams(location.search).get("c");
      if(c)openThread(c);else{show("inbox");loadInbox()}
    });
  }

  // ---- inbox ----
  // Who's waiting comes first, OLDEST first: the person who's waited longest is
  // the one about to text another detailer. Everyone else is just recent.
  function loadInbox(){
    return api("/api/threads").then(function(d){if(d&&d.ok){S.threads=d.threads||[];if(S.view==="inbox")renderInbox()}});
  }
  function matches(t){
    if(!S.q)return true;var q=S.q.toLowerCase();
    return [t.name,t.phone,t.lastBody,t.city,t.vehicleLabel].join(" ").toLowerCase().indexOf(q)>=0;
  }
  function rowHTML(t,waiting){
    var sub=[t.vehicleLabel,t.city].filter(Boolean).join(" · ");
    var tags=(t.dateRequested?'<span class="tag date">date asked for</span>':"")+(t.optedOut?'<span class="tag stop">do not text</span>':"");
    var ts=waiting?(t.waitSince||t.lastTs):t.lastTs;
    return '<button class="row'+(waiting?" wait":"")+'" data-p="'+esc(t.phone)+'">'+
      '<span class="dot'+(t.unread?"":" off")+'"></span>'+
      '<span class="mid"><div class="who">'+esc(who(t))+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':"")+
      '<div class="last">'+(t.lastDir==="out"?"Sent: ":"")+esc(t.lastBody||"")+'</div>'+tags+'</span>'+
      '<span class="age">'+(ts?(waiting?"waiting "+ago(ts):ago(ts)):"")+'</span></button>';
  }
  function renderInbox(){
    var live=S.threads.filter(function(t){return !t.archived&&matches(t)});
    var wait=live.filter(function(t){return t.awaitingReply&&!t.optedOut}).sort(function(a,b){return(a.waitSince||a.lastTs||0)-(b.waitSince||b.lastTs||0)});
    var rest=live.filter(function(t){return wait.indexOf(t)<0}).sort(function(a,b){return(b.lastTs||0)-(a.lastTs||0)}).slice(0,80);
    var h='<div class="sec hot"><span>Waiting on a reply</span><span>'+wait.length+'</span></div>';
    h+=wait.length?wait.map(function(t){return rowHTML(t,true)}).join(""):'<div class="empty">Nobody\'s waiting. Nice.</div>';
    h+='<div class="sec"><span>Everyone else</span></div>'+rest.map(function(t){return rowHTML(t,false)}).join("");
    el("inboxList").innerHTML=h;
    Array.prototype.forEach.call(el("inboxList").querySelectorAll("[data-p]"),function(b){b.onclick=function(){openThread(b.getAttribute("data-p"))}});
  }
  el("q").oninput=function(){S.q=this.value.trim();renderInbox()};

  // ---- conversation ----
  function openThread(phone){
    if(S.phone!==phone){el("box").value="";resetPolish()}
    S.phone=phone;
    return api("/api/thread?phone="+encodeURIComponent(phone)).then(function(d){
      if(!d||!d.ok||!d.thread)return;
      S.thread=d.thread;show("chat");el("ttl").innerHTML=esc(who(d.thread))+'<small>'+esc(fmtPhone(d.thread.phone))+'</small>';
      renderChat(true);
    });
  }
  function renderChat(jump){
    var t=S.thread;if(!t)return;
    var info=[];
    if(t.optedOut)info.push('<div class="line" style="color:var(--red)"><b style="color:var(--red)">Do not text.</b> They replied STOP.</div>');
    if(t.appointmentAt)info.push('<div class="line"><b>Booked:</b> '+esc(when(t.appointmentAt))+'</div>');
    if(t.dateRequest)info.push('<div class="line"><b>Asked Mikey for a date</b> '+esc(ago(t.dateRequest.at))+' ago'+(t.dateRequest.by?" ("+esc(t.dateRequest.by)+")":"")+'</div>');
    if(t.helperAsk)info.push('<div class="line"><b>Asked Mikey</b> '+esc(ago(t.helperAsk.at))+' ago: "'+esc(t.helperAsk.question)+'"</div>');
    if(t.garage&&t.garage.address)info.push('<div class="line"><b>Address:</b> '+esc(t.garage.address)+'</div>');
    if(t.notes)info.push('<div class="line">'+esc(t.notes)+'</div>');
    el("chatInfo").innerHTML=info.length?'<div class="info">'+info.join("")+'</div>':"";
    var h="",lastDay="";
    (t.messages||[]).slice(-80).forEach(function(m){
      var dk=dayKey(m.ts);if(dk!==lastDay){h+='<div class="day">'+esc(dk)+'</div>';lastDay=dk}
      var by=m.dir==="out"?(m.by?"sent by "+m.by:(m.kind&&m.kind!=="manual"?"automatic":"Mikey")):"";
      h+='<div class="b '+(m.dir==="out"?"out":"in")+'">'+esc(m.body||(m.media&&m.media.length?"[photo]":""))+
        '<span class="t">'+esc(when(m.ts))+(by?" · "+esc(by):"")+(m.status==="failed"||m.error?" · not delivered":"")+'</span></div>';
    });
    el("msgs").innerHTML=h;
    // The AI's own draft for this exact message, if it wrote one. Offered, never
    // sent: it goes in the box, where Send still gives it a read.
    var last=(t.messages||[])[t.messages.length-1],sg=t.suggested;
    if(sg&&sg.text&&last&&last.dir==="in"&&sg.forTs===last.ts&&!t.optedOut){
      el("sugg").innerHTML='<div class="sugg"><div class="h">Mikey\'s AI drafted a reply</div><div class="x">'+esc(sg.text)+'</div><button class="btn" id="useSugg">Put it in the box</button></div>';
      el("useSugg").onclick=function(){setBox(sg.text,true)};
    }else el("sugg").innerHTML="";
    el("sendBtn").disabled=!!t.optedOut;
    if(jump)setTimeout(function(){window.scrollTo(0,document.body.scrollHeight)},30);
  }
  function renderChips(){
    var q=(S.guide&&S.guide.quick)||[];
    el("chips").innerHTML=q.map(function(x,i){return'<button class="chip" data-i="'+i+'">'+esc(x.label)+'</button>'}).join("");
    Array.prototype.forEach.call(el("chips").querySelectorAll("[data-i]"),function(b){b.onclick=function(){
      var x=q[+b.getAttribute("data-i")];var cur=el("box").value.trim();
      setBox(cur?cur+" "+x.text:x.text,false);
    }});
  }
  function setBox(text,trusted){
    el("box").value=text;el("box").focus();
    // Starters are Mikey's own words, but anything combined with typing still
    // goes through polish. Only the AI's draft is already in his voice.
    if(trusted){P.ok=text;strip("","")}else{P.ok="";schedulePolish()}
  }
  el("backBtn").onclick=function(){S.phone="";S.thread=null;show("inbox");loadInbox()};
  el("guideBtn").onclick=function(){if(S.view==="guide"){if(S.thread)openThread(S.phone);else{show("inbox");renderInbox()}}else{show("guide");renderGuide()}};

  // ---- Auto Polish ----
  function strip(kind,html){var s=el("strip");s.className="strip"+(kind?" "+kind:"");s.innerHTML=html}
  function resetPolish(){clearTimeout(P.timer);P.ok="";P.before="";P.failed=false;P.seq++;P.busy=false;strip("","")}
  function worth(text){return text.length>=MIN&&text.split(/\s+/).length>=2}
  function schedulePolish(){
    clearTimeout(P.timer);
    var text=el("box").value.trim();
    if(!text||text===P.ok){return}
    if(!worth(text)){P.ok=text;strip("","");return}
    strip("","Auto Polish will check it when you pause…");
    P.timer=setTimeout(function(){polishNow()},IDLE);
  }
  function polishNow(){
    var text=el("box").value.trim();
    if(!text||text===P.ok||!S.phone)return Promise.resolve(true);
    if(!worth(text)){P.ok=text;return Promise.resolve(true)}
    var my=++P.seq;P.busy=true;strip("pol","✨ Polishing…");
    return post("/api/ai/draft",{phone:S.phone,text:text}).then(function(d){
      P.busy=false;
      if(my!==P.seq)return false;
      if(el("box").value.trim()!==text)return false;       // they kept typing; the next pause catches it
      if(!d||!d.ok||typeof d.draft!=="string"){
        // Polish is a help, not a gate. If it can't run, say so and let them send.
        P.failed=true;P.ok=text;strip("warn","Auto Polish is down right now. Read it over once, then Send.");return false;
      }
      var out=d.draft.trim()||text;
      var note=d.note?'<span>⚠ '+esc(d.note)+'</span>':"";
      if(out!==text){
        P.before=text;el("box").value=out;P.ok=out;
        strip("pol",'✨ Polished to sound like Mikey. Read it, then Send. <button id="undoP">Undo</button>'+note);
        el("undoP").onclick=function(){el("box").value=P.before;P.ok=P.before;strip("","Put your words back. Send when ready.")};
      }else{P.ok=text;strip(d.note?"warn":"pol",d.note?note:"✓ Sounds like Mikey.")}
      return false;
    }).catch(function(){P.busy=false;P.failed=true;P.ok=text;strip("warn","Auto Polish couldn't connect. Read it over once, then Send.");return false});
  }
  el("box").oninput=schedulePolish;

  // Send: if the box isn't what polish last saw, polish first and stop, so the
  // helper reads the version that will actually go out. The second tap sends it.
  el("sendBtn").onclick=function(){
    var text=el("box").value.trim();if(!text||!S.phone||P.busy)return;
    clearTimeout(P.timer);
    if(text!==P.ok){polishNow();return}
    var b=el("sendBtn");b.disabled=true;
    post("/api/send",{phone:S.phone,body:text}).then(function(d){
      b.disabled=false;
      if(d&&d.ok){el("box").value="";resetPolish();if(d.thread){S.thread=d.thread;renderChat(true)}toast("Sent");return}
      toast(d&&d.error==="recipient_opted_out"?"They texted STOP. Don't text them.":"Didn't send. Try again.");
    }).catch(function(){b.disabled=false;toast("No connection. Didn't send.")});
  };

  // ---- asking Mikey ----
  el("askDate").onclick=function(){
    if(!S.phone)return;
    var note=prompt("Anything Mikey should know? (which days work for them, how many cars, what they want done)","");
    if(note===null)return;
    post("/api/request-date",{phone:S.phone,note:note}).then(function(d){
      if(d&&d.ok){if(d.thread){S.thread=d.thread;renderChat(false)}toast("Mikey's been asked for a date")}else toast("Couldn't reach Mikey. Try again.");
    });
  };
  el("askQ").onclick=function(){
    if(!S.phone)return;
    var q=prompt("What do you need Mikey to decide?","");
    if(q===null||!q.trim())return;
    post("/api/helper/ask",{phone:S.phone,question:q.trim()}).then(function(d){
      if(d&&d.ok){if(S.thread){S.thread.helperAsk=d.helperAsk;renderChat(false)}toast("Sent to Mikey")}else toast("Couldn't reach Mikey. Try again.");
    });
  };

  // ---- guide ----
  function money(n){return n==null||n===""?"":"$"+n}
  function renderGuide(){
    var g=S.guide;if(!g){el("guideView").innerHTML='<div class="empty">Loading…</div>';return}
    var h="";
    if(g.notes)h+='<div class="notes"><b>From Mikey</b>'+esc(g.notes)+'</div>';
    (g.guide||[]).forEach(function(s,i){
      h+='<h2>'+esc(s.title)+'</h2><ul>'+s.points.map(function(p){return'<li>'+esc(p)+'</li>'}).join("")+'</ul>';
      if(i===1&&(g.prices||[]).length){
        h+='<h2>Price list</h2><table><tr><th>Service</th><th>Car</th><th>SUV</th><th>Truck / XL</th></tr>'+
          g.prices.map(function(p){return'<tr><td>'+esc(p.name)+'</td><td class="n">'+money(p.price.sedan)+'</td><td class="n">'+money(p.price.suv)+'</td><td class="n">'+money(p.price.truck)+'</td></tr>'}).join("")+
          '</table>';
        if((g.addons||[]).length)h+='<ul style="margin-top:10px">'+g.addons.map(function(a){return'<li>'+esc(a.name)+': +'+money(a.price)+'</li>'}).join("")+'</ul>';
        h+='<ul><li>Ceramic coating: from $500, Mikey quotes it.</li><li>Paint correction: Mikey quotes it.</li><li>Rough condition, lots of pet hair or stains can cost more. Ask Mikey before quoting those.</li></ul>';
      }
    });
    h+='<h2>Tap-to-use replies</h2>'+(g.quick||[]).map(function(x){return'<div class="q"><b>'+esc(x.label)+'</b>'+esc(x.text)+'</div>'}).join("");
    el("guideView").innerHTML=h;
  }

  // ---- keep it live ----
  // The inbox every 20s, an open conversation every 15s, but never while a
  // reply is being written: a re-render mid-thought moves the page under them.
  setInterval(function(){
    if(document.hidden||!S.role)return;
    if(S.view==="inbox")loadInbox();
    else if(S.view==="chat"&&S.phone&&!el("box").value.trim()&&!P.busy){
      api("/api/thread?phone="+encodeURIComponent(S.phone)).then(function(d){
        if(d&&d.ok&&d.thread&&S.view==="chat"&&d.thread.phone===S.phone){
          var grew=(d.thread.messages||[]).length!==((S.thread&&S.thread.messages)||[]).length;
          S.thread=d.thread;renderChat(grew);
        }
      });
    }
  },15000);

  boot();
})();
</script>
</body>
</html>
