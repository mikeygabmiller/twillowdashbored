<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mikey Texts">
<title>Messages</title>
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/helper.webmanifest">
<style>
  /* The helper's whole world, laid out like the Messages app on their own phone
     so there is nothing to learn: a list of conversations, newest first, and a
     chat with bubbles and a box at the bottom. Everything a helper shouldn't
     touch (money, settings, bookings, automations) lives in the main app, and
     the Worker refuses those routes to this PIN anyway. Same dark base as
     bookings.html, with light purple where that page uses red. */
  :root{
    --bg:#0c0c0e; --card:#17171b; --card2:#1f1f25; --line:#2a2a31; --line2:#37373f;
    --txt:#f4f4f6; --muted:#a2a2ac; --faint:#71717a;
    --lav:#c9b8ff; --lavbg:#1d1733; --amber:#f5a524; --green:#2fd07a; --blue:#4c9ffe;
    --me:#7b5cff; --them:#26252b;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
  input,textarea{font:inherit}
  .hide{display:none!important}
  .screen{max-width:720px;margin:0 auto}

  /* ---- sign in ---- */
  .login{max-width:340px;margin:18vh auto 0;padding:0 16px;text-align:center}
  .login h1{font-size:22px;margin:0 0 6px}
  .login p{color:var(--muted);margin:0 0 18px}
  .login input{width:100%;font-size:26px;letter-spacing:8px;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--txt)}
  .login button{width:100%;margin-top:12px;padding:13px;border-radius:12px;background:var(--lav);color:#1a1033;font-weight:700;font-size:16px}
  .err{color:var(--lav);min-height:22px;margin-top:10px;font-size:14px}

  /* ---- top bars ---- */
  .top{position:sticky;top:0;z-index:10;background:rgba(12,12,14,.94);backdrop-filter:blur(12px);padding:8px 16px 10px;padding-top:max(8px,env(safe-area-inset-top))}
  .toprow{display:flex;justify-content:space-between;align-items:center;min-height:34px;gap:14px}
  .toprow .grow{flex:1}
  .link{color:var(--lav);font-size:16px;padding:6px 2px}
  .big{font-size:32px;font-weight:800;margin:2px 0 0;letter-spacing:-.01em}
  .whoami{color:var(--muted);font-size:13px;margin-top:1px}
  .search{width:100%;margin-top:10px;padding:9px 12px;border-radius:10px;border:0;background:var(--card2);color:var(--txt);font-size:16px}
  .search::placeholder{color:var(--faint)}
  .seg{display:flex;gap:6px;margin-top:10px}
  .seg button{flex:1;padding:7px 10px;border-radius:9px;background:var(--card);color:var(--muted);font-size:14px;font-weight:600}
  .seg button.on{background:var(--lavbg);color:var(--lav)}
  .banner{margin:8px 16px 0;padding:9px 12px;border-radius:10px;background:var(--lavbg);color:var(--lav);font-size:13px}
  .banner a{color:#fff}
  .card{margin:10px 16px 2px;padding:12px 14px;border-radius:14px;background:var(--lavbg);border:1px solid #3a2f73;font-size:14px;display:flex;gap:10px;align-items:flex-start}
  .card .tx{flex:1}
  .card b{display:block;color:var(--lav);margin-bottom:2px}
  .card .go{margin-top:8px;background:var(--lav);color:#1a1033;font-weight:700;padding:7px 14px;border-radius:10px;font-size:14px}
  .card .x{color:var(--muted);font-size:20px;line-height:1;padding:0 2px}

  /* ---- conversation list ---- */
  .list{padding:0 0 40px}
  .row{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:10px 16px 10px 8px}
  .row:active{background:var(--card)}
  .row .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}
  .row .dot.off{visibility:hidden}
  .av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff}
  .row .mid{flex:1;min-width:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:-12px}
  .row .l1{display:flex;align-items:baseline;gap:8px}
  .row .who{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .when{color:var(--muted);font-size:14px;white-space:nowrap}
  .row .last{color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row.unread .last{color:var(--txt)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin:4px 4px 0 0}
  .pill.need{background:var(--lavbg);color:var(--lav)}
  .pill.date{background:rgba(245,165,36,.14);color:var(--amber)}
  .pill.ans{background:rgba(47,208,122,.14);color:var(--green)}
  .pill.stop{background:var(--card2);color:var(--muted)}
  .more{display:block;width:calc(100% - 32px);margin:14px 16px;padding:11px;border-radius:12px;background:var(--card);color:var(--lav);font-weight:600}
  .empty{color:var(--muted);text-align:center;padding:40px 20px}
  .filters{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{flex:none;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px;white-space:nowrap}
  .fchip.on{border-color:var(--lav);color:var(--lav);background:var(--lavbg)}
  .fchip .n{opacity:.7}
  .sw{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
  .stg{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;margin:4px 4px 0 0}
  .lbl{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;margin:4px 4px 0 0;background:var(--card2);color:var(--txt)}
  .pill.fol{background:rgba(76,159,254,.14);color:var(--blue)}
  .pill.fol.due{background:rgba(245,165,36,.16);color:var(--amber)}
  /* organize card in a chat */
  .org{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:0 0 10px;font-size:14px}
  .org h4{margin:10px 0 6px;font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
  .org h4:first-child{margin-top:0}
  .org h4 button{color:var(--lav);font-size:13px;text-transform:none;letter-spacing:0;font-weight:600}
  .org .row2{display:flex;flex-wrap:wrap;gap:6px}
  .sbtn{padding:6px 10px;border-radius:9px;background:var(--bg);border:1px solid var(--line2);font-size:13px;color:var(--muted)}
  .sbtn.on{font-weight:700}
  .lbtn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--bg);border:1px dashed var(--line2);font-size:13px;color:var(--muted)}
  .lbtn.on{border-style:solid;color:var(--txt);background:var(--card2)}
  .chk{display:flex;flex-direction:column;gap:4px}
  .chk button{display:flex;align-items:center;gap:9px;text-align:left;padding:4px 0;font-size:14px;color:var(--muted)}
  .chk .bx{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
  .chk button.done{color:var(--txt)}
  .chk button.done .bx{background:var(--green);border-color:var(--green);color:#06210f}
  .chk small{color:var(--faint);margin-left:auto;font-size:11px}
  .next{margin-top:6px;color:var(--lav);font-size:13px}
  .fol-line{display:flex;align-items:center;gap:8px;color:var(--txt)}
  .fol-line.due{color:var(--amber)}
  .note{border-top:1px solid var(--line);padding:7px 26px 5px 0;white-space:pre-wrap;color:var(--txt);position:relative}
  .note:first-of-type{border-top:0}
  .note small{display:block;color:var(--faint);font-size:11px;margin-top:2px}
  .note .del{position:absolute;right:0;top:6px;color:var(--faint);font-size:16px}
  .addnote{display:flex;gap:6px;margin-top:6px}
  .addnote input{flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--txt);font-size:15px}
  .addnote button{padding:8px 12px;border-radius:10px;background:var(--lavbg);color:var(--lav);font-weight:700}

  /* ---- chat ---- */
  .chat{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .cbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(12,12,14,.96)}
  .back{color:var(--lav);font-size:30px;line-height:1;padding:2px 8px 6px 4px;width:40px}
  .cwho{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
  .cwho .av{width:34px;height:34px;font-size:13px}
  .cwho .nm{font-size:13px;font-weight:600;margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cwho .sub{font-size:11px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ibtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--lav)}
  .ibtn span{width:22px;height:22px;border:1.6px solid var(--lav);border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 13px/1 Georgia,serif}
  .scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 6px}
  .info{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:0 0 10px;font-size:14px;color:var(--muted);white-space:pre-wrap}
  .info .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .info .ih span{font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
  .info .ih button{color:var(--lav);font-weight:600;font-size:14px}
  .info b{color:var(--txt)}
  .info .line{margin:2px 0}
  .info .warn,.info .warn b{color:var(--lav)}
  .msgs{display:flex;flex-direction:column}
  .stamp{align-self:center;font-size:12px;color:var(--faint);margin:14px 0 6px}
  .b{max-width:78%;padding:8px 13px;border-radius:19px;white-space:pre-wrap;word-wrap:break-word;font-size:16px;margin-top:2px}
  .b.in{align-self:flex-start;background:var(--them)}
  .b.out{align-self:flex-end;background:var(--me);color:#fff}
  .b.in.tail{border-bottom-left-radius:5px}
  .b.out.tail{border-bottom-right-radius:5px}
  .b.gap,.ph.gap{margin-top:9px}
  .b.fail{background:#3a2330}
  .ph{max-width:66%;margin-top:2px;border-radius:16px;overflow:hidden;background:var(--card2);min-height:60px}
  .ph.in{align-self:flex-start}.ph.out{align-self:flex-end}
  .ph img{display:block;width:100%;max-height:320px;object-fit:cover;cursor:zoom-in}
  .ph audio{display:block;width:240px;max-width:100%;margin:6px}
  .cap{font-size:11px;color:var(--faint);margin:3px 6px 0}
  .cap.out{align-self:flex-end}
  .ans{align-self:stretch;margin:12px 0 4px;padding:10px 12px;border-radius:14px;background:rgba(47,208,122,.08);border:1px solid rgba(47,208,122,.35);font-size:15px;white-space:pre-wrap}
  .ans b{display:block;font-size:12px;color:var(--green);margin-bottom:3px}
  .sugg{background:var(--lavbg);border:1px solid #3a2f73;border-radius:14px;padding:10px 12px;margin:12px 0 4px}
  .sugg .h{font-size:12px;font-weight:700;color:var(--lav);margin-bottom:4px}
  .sugg .x{white-space:pre-wrap;font-size:15px}
  .sugg button{margin-top:8px;color:var(--lav);font-weight:700;font-size:14px}
  .composer{flex:none;border-top:1px solid var(--line);background:var(--bg);padding:6px 10px max(8px,env(safe-area-inset-bottom))}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 7px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--card2);border:1px solid var(--line2);border-radius:99px;padding:5px 11px;font-size:13px;white-space:nowrap}
  .inrow{display:flex;align-items:flex-end;gap:8px}
  .plus{flex:none;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--lav);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
  .field{flex:1;display:flex;align-items:flex-end;border:1px solid var(--line2);border-radius:20px;background:var(--bg);padding:3px 3px 3px 13px}
  textarea{flex:1;border:0;background:none;color:var(--txt);font-size:16px;line-height:1.35;resize:none;padding:6px 0;max-height:34vh;min-height:34px;height:34px}
  textarea:focus{outline:none}
  .send{flex:none;width:32px;height:32px;border-radius:50%;background:var(--me);color:#fff;display:flex;align-items:center;justify-content:center}
  .send:disabled{background:var(--card2);color:var(--faint)}
  .send svg{width:16px;height:16px}
  .strip{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:13px;color:var(--muted);margin:0 4px 6px}
  .strip:empty{display:none}
  .strip.pol{color:var(--lav)}
  .strip.warn{color:var(--amber)}
  .strip button{color:var(--blue);font-weight:700;padding:2px 4px}

  /* ---- sheets ---- */
  .sheetbg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:720px;padding:8px 10px max(10px,env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
  .sheet .grp{background:var(--card2);border-radius:14px;overflow:hidden;margin-bottom:8px}
  .sheet .grp>button{display:block;width:100%;padding:15px;text-align:center;font-size:17px;color:var(--lav);border-bottom:1px solid var(--line2)}
  .sheet .grp>button:last-child{border-bottom:0}
  .sheet .grp>button small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .sheet .cancel{font-weight:700}
  .form{padding:14px}
  .form h3{margin:0 0 10px;font-size:17px;text-align:center}
  .form label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .form input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--txt);font-size:16px}
  .form .save{display:block;width:100%;margin-top:14px;padding:12px;border-radius:12px;background:var(--lav);color:#1a1033;font-weight:700;font-size:16px}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opt{padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);font-size:14px}
  .opt.on{background:var(--lavbg);border-color:var(--lav);color:var(--lav);font-weight:600}
  .total{margin-top:14px;padding:12px;border-radius:12px;background:var(--bg);text-align:center}
  .total b{display:block;font-size:28px;color:var(--lav)}
  .total span{font-size:14px;color:var(--muted)}
  .lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain}

  /* ---- schedule ---- */
  .wk{padding:4px 16px 40px}
  .day{margin-top:14px}
  .day .dh{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 6px}
  .day .dh b{font-size:16px}
  .day .dh span{font-size:13px;font-weight:700}
  .room{color:var(--green)}.full{color:var(--amber)}.off{color:var(--faint)}
  .job{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px}
  .job .t{font-weight:700;min-width:64px}
  .job .d{flex:1;min-width:0;color:var(--muted);font-size:14px}
  .job .d b{color:var(--txt);display:block;font-size:15px}
  .nojobs{color:var(--faint);font-size:14px;padding:0 2px 4px}

  /* ---- guide ---- */
  .g{padding:0 16px 40px}
  .g h2{font-size:17px;margin:22px 0 8px}
  .g ul{margin:0;padding-left:20px}
  .g li{margin:6px 0}
  .notes{background:#0f2016;border:1px solid #1f5234;border-radius:14px;padding:12px 14px;margin-top:14px;white-space:pre-wrap}
  .notes b{display:block;color:var(--green);font-size:13px;margin-bottom:4px}
  table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border-radius:12px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px}
  td.n{white-space:nowrap}
  .q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
  .q b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
  .toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;max-width:90vw}
</style>
</head>
<body>

<div class="login hide" id="loginView">
  <h1>Texting for Mikey</h1>
  <p>Enter your PIN</p>
  <input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password" maxlength="64">
  <button id="pinGo">Sign in</button>
  <div class="err" id="pinErr"></div>
</div>

<div class="screen hide" id="listView">
  <div class="top">
    <div class="toprow"><button class="link" id="weekBtn">Schedule</button><button class="link" id="guideBtn">Guide</button><span class="grow"></span><button class="link" id="outBtn">Sign out</button></div>
    <h1 class="big">Messages</h1>
    <div class="whoami" id="whoami"></div>
    <input class="search" id="q" type="search" placeholder="Search">
    <div class="seg"><button id="segAll" class="on">All</button><button id="segNeed">Needs reply</button><button id="segFol">Follow-ups</button></div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="banner hide" id="ownerBanner">This is what your helper sees. <a href="/">Back to your app</a></div>
  <div id="alertCard"></div>
  <div class="list" id="list"></div>
</div>

<div class="screen chat hide" id="chatView">
  <div class="cbar">
    <button class="back" id="backBtn" aria-label="Back">&lsaquo;</button>
    <div class="cwho"><span class="av" id="chatAv"></span><span class="nm" id="chatName"></span><span class="sub" id="chatSub"></span></div>
    <button class="ibtn" id="infoBtn" aria-label="Details"><span>i</span></button>
  </div>
  <div class="scroller" id="scroller">
    <div id="chatInfo"></div>
    <div id="org"></div>
    <div class="msgs" id="msgs"></div>
    <div id="answer"></div>
    <div id="sugg"></div>
  </div>
  <div class="composer">
    <div class="strip" id="strip"></div>
    <div class="chips" id="chips"></div>
    <div class="inrow">
      <button class="plus" id="plusBtn" aria-label="More">+</button>
      <div class="field">
        <textarea id="box" rows="1" placeholder="Text Message"></textarea>
        <button class="send" id="sendBtn" aria-label="Send" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
      </div>
    </div>
  </div>
</div>

<div class="screen hide" id="weekView">
  <div class="top"><div class="toprow"><button class="link" id="weekBack">&lsaquo; Back</button><span></span></div><h1 class="big">Schedule</h1>
    <div class="whoami">What's already booked. Mikey still picks every time.</div></div>
  <div class="wk" id="weekBody"></div>
</div>

<div class="screen hide" id="guideView">
  <div class="top"><div class="toprow"><button class="link" id="guideBack">&lsaquo; Back</button><span></span></div><h1 class="big">Guide</h1></div>
  <div class="g" id="guideBody"></div>
</div>

<div class="sheetbg hide" id="sheet">
  <div class="sheet">
    <div class="grp">
      <button id="calcBtn">Price calculator<small>Pick the service and size, get the exact price</small></button>
      <button id="askDate">Ask Mikey for a date<small>They're ready to book. He picks the day and time.</small></button>
      <button id="askQ">Ask Mikey something<small>A price, a question, anything that's his call</small></button>
      <button id="doneBtn">No reply needed<small>Their last text doesn't need an answer ("thanks!", a thumbs up)</small></button>
      <button id="folBtn">Remind me to follow up<small>It comes back to the top of your list, and your phone buzzes</small></button>
      <button id="noteBtn">Add a note</button>
      <button id="editBtn">Save name, address or car</button>
      <button id="sheetGuide">Open the guide</button>
    </div>
    <div class="grp"><button class="cancel" id="sheetX">Cancel</button></div>
  </div>
</div>
<div class="sheetbg hide" id="formSheet"><div class="sheet"><div class="grp" id="formBody"></div><div class="grp"><button class="cancel" id="formX">Cancel</button></div></div></div>

<script>
(function(){
  "use strict";
  var TZ="America/Los_Angeles";
  var S={role:"",name:"",threads:[],phone:"",thread:null,guide:null,view:"",q:"",seg:"all",showArch:false,since:0,from:"list",stage:"",label:""};
  // Auto Polish state. `ok` is the exact text that has been through polish (or
  // that the helper deliberately kept with Undo). Send only goes out when the
  // box still matches it, which is how every text gets a voice check without a
  // second button to remember.
  var P={timer:null,busy:false,ok:"",before:"",seq:0};
  var IDLE=2400, MIN=10;

  function el(id){return document.getElementById(id)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
  // Per-device memory (drafts, what's been seen, a dismissed card). Wrapped:
  // private mode or blocked storage just means nothing is remembered.
  function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function api(path,opts){
    return fetch(path,Object.assign({credentials:"same-origin"},opts||{})).then(function(r){
      if(r.status===401){showLogin();return{ok:false,unauthorized:true}}
      return r.json().catch(function(){return{ok:false}});
    });
  }
  function post(path,body){return api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})}
  function ago(ts){
    var m=Math.max(0,Math.round((Date.now()-ts)/60000));
    if(m<1)return"just now";if(m<60)return m+"m";var h=Math.round(m/60);if(h<48)return h+"h";return Math.round(h/24)+"d";
  }
  function fmtPhone(p){var d=String(p||"").replace(/\D/g,"");if(d.length===11&&d[0]==="1")d=d.slice(1);return d.length===10?"("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6):String(p||"")}
  function who(t){return(t&&t.name&&String(t.name).trim())||fmtPhone(t&&t.phone)}
  function fmt(ts,o){try{return new Date(ts).toLocaleString("en-US",Object.assign({timeZone:TZ},o))}catch(e){return new Date(ts).toLocaleString()}}
  function ymd(ts){return fmt(ts,{year:"numeric",month:"2-digit",day:"2-digit"})}
  // The list's time column, the way a phone shows it: a time today, "Yesterday",
  // a weekday this week, a date after that.
  function listWhen(ts){
    if(!ts)return"";
    var now=Date.now();
    if(ymd(ts)===ymd(now))return fmt(ts,{hour:"numeric",minute:"2-digit"});
    if(ymd(ts)===ymd(now-864e5))return"Yesterday";
    if(now-ts<6*864e5)return fmt(ts,{weekday:"long"});
    return fmt(ts,{month:"numeric",day:"numeric",year:"2-digit"});
  }
  function stampText(ts){
    var now=Date.now(),t=fmt(ts,{hour:"numeric",minute:"2-digit"});
    if(ymd(ts)===ymd(now))return"Today "+t;
    if(ymd(ts)===ymd(now-864e5))return"Yesterday "+t;
    return fmt(ts,{weekday:"short",month:"short",day:"numeric"})+" at "+t;
  }
  var AV=["#6d5bd0","#3b82f6","#0ea5a4","#16a34a","#ca8a04","#db2777","#7c3aed","#2563eb","#059669","#9333ea"];
  function avColor(p){var h=0,s=String(p||"");for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return AV[h%AV.length]}
  function initials(t){
    var n=t&&t.name&&String(t.name).trim();
    if(!n)return"#";
    var w=n.split(/\s+/).filter(function(x){return/[A-Za-z]/.test(x)});
    return w.length?(w[0][0]+(w.length>1?w[w.length-1][0]:"")).toUpperCase():"#";
  }
  function avHTML(t,id){return'<span class="av"'+(id?' id="'+id+'"':'')+' style="background:'+avColor(t.phone)+'">'+esc(initials(t))+'</span>'}
  function carOf(t){var v=t&&t.garage&&t.garage.vehicles&&t.garage.vehicles[0];return v?[v.year,v.make,v.model].filter(Boolean).join(" "):""}
  // ---- stages and labels ----
  // Their own pipeline, separate from Mikey's won/lost on purpose: his drive
  // automatic texts, these never do. Unset, a stage is read off what's already
  // true (a booked time, an open question to Mikey, a quote) so a new helper's
  // list isn't a wall of "New".
  var STAGES=[["new","New","#8b8b96"],["quoted","Quoted","#4c9ffe"],["waiting","Waiting on Mikey","#f5a524"],["booked","Booked","#2fd07a"],["done","Done","#c9b8ff"],["no","Not interested","#5c5c66"]];
  function stageMeta(k){for(var i=0;i<STAGES.length;i++)if(STAGES[i][0]===k)return STAGES[i];return STAGES[0]}
  function stageOf(t){
    if(t.helperStage)return t.helperStage;
    if(t.status==="won")return"done";
    if(t.status==="lost")return"no";
    if(t.appointmentAt&&t.appointmentAt>Date.now()-12*36e5)return"booked";
    if(t.helperAskAt&&!t.helperAnsweredAt)return"waiting";
    if(t.quoteAt||(t.tags||[]).indexOf("quoted")>=0||(t.quote&&t.quote.total))return"quoted";
    return"new";
  }
  function stageHTML(k){var m=stageMeta(k);return'<span class="stg" style="background:'+m[2]+'22;color:'+m[2]+'">'+esc(m[1])+'</span>'}
  var LCOL=["#c9b8ff","#4c9ffe","#2fd07a","#f5a524","#ff8fb1","#5eead4","#fca5a5","#a3e635","#fdba74","#93c5fd"];
  // By position in the label set, so no two labels in the list share a color.
  function labelColor(l){
    var set=labelSet().map(function(x){return x.toLowerCase()}),i=set.indexOf(String(l).toLowerCase());
    if(i<0){i=0;var s=String(l).toLowerCase();for(var j=0;j<s.length;j++)i=(i*31+s.charCodeAt(j))>>>0}
    return LCOL[i%LCOL.length];
  }
  function labelSet(){return(S.guide&&S.guide.labels)||[]}
  function labelsOn(t){var set=labelSet().map(function(x){return x.toLowerCase()});return(t.tags||[]).filter(function(x){return set.indexOf(String(x).toLowerCase())>=0})}
  function lblHTML(l){return'<span class="lbl"><span class="sw" style="background:'+labelColor(l)+'"></span>'+esc(l)+'</span>'}
  function folWhen(at){
    var d=new Date(at),now=Date.now();
    if(at<now&&ymd(at)!==ymd(now))return"overdue";
    if(ymd(at)===ymd(now))return"today";
    if(ymd(at)===ymd(now+864e5))return"tomorrow";
    return fmt(at,{weekday:"short",month:"numeric",day:"numeric"});
  }
  // "Needs reply" on this page means: waiting on an answer AND their last text
  // came in after the helper's start line. His older backlog stays his; a
  // customer who texts again after the line shows up like anyone else.
  function needs(t){return !!(t.awaitingReply&&!t.optedOut&&!t.archived&&(t.lastTs||0)>=S.since)}
  // Mikey answered something they asked, and they haven't opened it since.
  var SEEN=lsGet("mkh-seen",{});
  function answerNew(t){return !!(t.helperAnsweredAt&&t.helperAnsweredAt>(SEEN[t.phone]||0))}
  function markSeen(p){SEEN[p]=Date.now();lsSet("mkh-seen",SEEN)}

  function show(v){
    S.view=v;
    ["loginView","listView","chatView","weekView","guideView"].forEach(function(id){el(id).classList.toggle("hide",id!==v+"View")});
    el("ownerBanner").classList.toggle("hide",S.role!=="owner");
    if(v!=="chat")window.scrollTo(0,0);
  }

  // ---- sign in ----
  function showLogin(){show("login");setTimeout(function(){el("pinIn").focus()},50)}
  function doLogin(){
    var v=el("pinIn").value.trim();if(!v)return;
    el("pinErr").textContent="";
    post("/api/login",{password:v}).then(function(d){
      if(d&&d.ok){el("pinIn").value="";boot();return}
      el("pinErr").textContent=d&&d.error==="locked"?"Too many wrong tries. Wait "+(d.minutes||15)+" min.":"Wrong PIN, try again";
      el("pinIn").select();
    }).catch(function(){el("pinErr").textContent="No connection, try again"});
  }
  el("pinGo").onclick=doLogin;
  el("pinIn").onkeydown=function(e){if(e.key==="Enter")doLogin()};
  el("outBtn").onclick=function(){post("/api/logout").then(function(){S.role="";showLogin()})};

  function boot(){
    api("/api/whoami").then(function(d){
      if(!d||!d.ok)return;
      S.role=d.role;S.name=d.name||"";
      api("/api/helper/guide").then(function(g){
        if(!g||!g.ok)return;
        S.guide=g;S.since=+g.since||0;if(!S.name)S.name=g.name||"";
        renderChips();renderWho();
        if(S.view==="guide")renderGuide();if(S.view==="list")renderList();
      });
      renderAlertCard();
      var c=new URLSearchParams(location.search).get("c");
      if(c)openThread(c);else{show("list");renderWho();loadList()}
    });
  }
  function renderWho(){el("whoami").textContent=S.role==="owner"?"Helper view":("Texting for Mikey"+(S.name?" · "+S.name:""))}

  // ---- phone alerts ----
  // The one thing that makes "answer within 15 minutes" possible: their phone
  // buzzes when a customer texts. iPhones only allow it from a home-screen app,
  // so on an iPhone in the browser the card says how to get there first.
  function pushOK(){return "serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window}
  function isIOS(){return/iPhone|iPad|iPod/.test(navigator.userAgent)}
  function standalone(){try{return window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}}
  function alertState(){
    if(S.role!=="helper")return"none";
    if(isIOS()&&!standalone())return"install";
    if(!pushOK())return"none";
    if(Notification.permission==="denied")return"blocked";
    if(Notification.permission==="granted"&&lsGet("mkh-push",false))return"on";
    return"off";
  }
  function renderAlertCard(){
    var st=alertState(),box=el("alertCard");
    if(st==="none"||st==="on"||lsGet("mkh-card-x",false)){box.innerHTML="";return}
    var h=st==="install"
      ?'<b>Get a buzz when a customer texts</b>Tap the Share button, then <b>Add to Home Screen</b>. Open "Mikey Texts" from your home screen and turn alerts on there.'
      :st==="blocked"
        ?'<b>Alerts are blocked</b>Turn notifications back on for this site in your phone\'s settings, then reload.'
        :'<b>Get a buzz when a customer texts</b>So nobody waits. You can turn it off any time.<br><button class="go" id="alertOn">Turn on alerts</button>';
    box.innerHTML='<div class="card"><div class="tx">'+h+'</div><button class="x" id="alertX" aria-label="Dismiss">&times;</button></div>';
    el("alertX").onclick=function(){lsSet("mkh-card-x",true);renderAlertCard()};
    if(el("alertOn"))el("alertOn").onclick=enableAlerts;
  }
  function b64u(s){var p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  function enableAlerts(){
    var reg;
    navigator.serviceWorker.register("/sw.js").then(function(){return navigator.serviceWorker.ready}).then(function(r){reg=r;return Notification.requestPermission()})
      .then(function(p){if(p!=="granted")throw new Error("denied");return api("/api/push/key")})
      .then(function(k){return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.key)})})})
      .then(function(sub){return post("/api/helper/push",{endpoint:sub.endpoint})})
      .then(function(d){if(d&&d.ok){lsSet("mkh-push",true);toast("Alerts are on");renderAlertCard()}else throw new Error("save")})
      .catch(function(e){toast(e&&e.message==="denied"?"Alerts weren't allowed":"Couldn't turn alerts on. Try again.");renderAlertCard()});
  }

  // ---- conversation list ----
  // One list, newest first, every conversation, like the phone's own Messages.
  // "Needs reply" is a filter you choose, not a wall of red at the top.
  function loadList(){
    return api("/api/threads").then(function(d){if(d&&d.ok){S.threads=d.threads||[];if(S.view==="list")renderList();badge()}});
  }
  function badge(){
    var n=S.threads.filter(function(t){return t.unread&&!t.archived}).length;
    document.title=(n?"("+n+") ":"")+"Messages";
  }
  function matches(t){
    if(!S.q)return true;var q=S.q.toLowerCase();
    return [t.name,t.phone,fmtPhone(t.phone),t.lastBody,t.city,t.vehicleLabel,t.address].join(" ").toLowerCase().indexOf(q)>=0;
  }
  function rowHTML(t){
    var pills=(needs(t)?'<span class="pill need">Needs reply · '+esc(ago(t.lastTs))+'</span>':"")+
      (answerNew(t)?'<span class="pill ans">Mikey answered</span>':(t.helperAskAt&&!t.helperAnsweredAt?'<span class="pill date">Waiting on Mikey</span>':""))+
      (t.dateRequested&&!t.helperAskAt?'<span class="pill date">Date asked for</span>':"")+
      (t.optedOut?'<span class="pill stop">Do not text</span>':"")+
      (t.helperFollowAt?'<span class="pill fol'+(/^(today|overdue)$/.test(folWhen(t.helperFollowAt))?" due":"")+'">Follow up '+esc(folWhen(t.helperFollowAt))+'</span>':"");
    pills=stageHTML(stageOf(t))+labelsOn(t).map(lblHTML).join("")+pills;
    var last=(t.lastDir==="out"?"You: ":"")+(t.lastBody||"");
    return '<button class="row'+(t.unread?" unread":"")+'" data-p="'+esc(t.phone)+'">'+
      '<span class="dot'+(t.unread?"":" off")+'"></span>'+avHTML(t)+
      '<span class="mid"><span class="l1"><span class="who">'+esc(who(t))+'</span><span class="when">'+esc(listWhen(t.lastTs))+'</span></span>'+
      '<span class="last">'+esc(last)+'</span>'+(pills?'<span>'+pills+'</span>':"")+'</span></button>';
  }
  function renderList(){
    var all=S.threads.filter(matches).sort(function(a,b){return(b.lastTs||0)-(a.lastTs||0)});
    var live=all.filter(function(t){return !t.archived}),arch=all.filter(function(t){return t.archived});
    var needN=S.threads.filter(needs).length;
    el("segNeed").textContent="Needs reply"+(needN?" ("+needN+")":"");
    renderFilters(live);
    var shown=S.seg==="need"?live.filter(needs):live;
    if(S.seg==="fol")shown=live.filter(function(t){return t.helperFollowAt}).sort(function(a,b){return a.helperFollowAt-b.helperFollowAt});
    if(S.stage)shown=shown.filter(function(t){return stageOf(t)===S.stage});
    if(S.label)shown=shown.filter(function(t){return labelsOn(t).some(function(x){return x.toLowerCase()===S.label.toLowerCase()})});
    var h=shown.length?shown.map(rowHTML).join(""):'<div class="empty">'+(S.seg==="need"?"Nobody's waiting on a reply. Nice.":S.seg==="fol"?"No follow-ups set. Use + in a chat to add one.":(S.q||S.stage||S.label?"Nothing matches.":"No conversations yet."))+'</div>';
    var folN=live.filter(function(t){return t.helperFollowAt&&t.helperFollowAt<=Date.now()}).length;
    el("segFol").textContent="Follow-ups"+(folN?" ("+folN+")":"");
    if(S.seg==="all"&&!S.stage&&!S.label&&arch.length){
      h+='<button class="more" id="archBtn">'+(S.showArch?"Hide archived":"Show archived ("+arch.length+")")+'</button>';
      if(S.showArch)h+=arch.map(rowHTML).join("");
    }
    el("list").innerHTML=h;
    Array.prototype.forEach.call(el("list").querySelectorAll("[data-p]"),function(b){b.onclick=function(){openThread(b.getAttribute("data-p"))}});
    if(el("archBtn"))el("archBtn").onclick=function(){S.showArch=!S.showArch;renderList()};
  }
  el("q").oninput=function(){S.q=this.value.trim();renderList()};
  function setSeg(k){S.seg=k;[["all","segAll"],["need","segNeed"],["fol","segFol"]].forEach(function(x){el(x[1]).classList.toggle("on",x[0]===k)});renderList()}
  el("segAll").onclick=function(){setSeg("all")};
  el("segNeed").onclick=function(){setSeg("need")};
  el("segFol").onclick=function(){setSeg("fol")};
  // One row of filter chips: every stage with its count, then every label.
  // Tap one to narrow the list, tap it again to clear it.
  function renderFilters(live){
    var h=STAGES.map(function(m){
      var n=live.filter(function(t){return stageOf(t)===m[0]}).length;
      return'<button class="fchip'+(S.stage===m[0]?" on":"")+'" data-st="'+m[0]+'"><span class="sw" style="background:'+m[2]+'"></span>'+esc(m[1])+' <span class="n">'+n+'</span></button>';
    }).join("")+labelSet().map(function(l){
      var n=live.filter(function(t){return labelsOn(t).some(function(x){return x.toLowerCase()===l.toLowerCase()})}).length;
      return'<button class="fchip'+(S.label===l?" on":"")+'" data-lb="'+esc(l)+'"><span class="sw" style="background:'+labelColor(l)+'"></span>'+esc(l)+' <span class="n">'+n+'</span></button>';
    }).join("");
    el("filters").innerHTML=h;
    Array.prototype.forEach.call(el("filters").querySelectorAll("[data-st]"),function(b){b.onclick=function(){var k=b.getAttribute("data-st");S.stage=S.stage===k?"":k;renderList()}});
    Array.prototype.forEach.call(el("filters").querySelectorAll("[data-lb]"),function(b){b.onclick=function(){var k=b.getAttribute("data-lb");S.label=S.label===k?"":k;renderList()}});
  }

  // ---- drafts ----
  // Leave a half-written reply to check something and it's still there when you
  // come back, per conversation, like a phone keeps it.
  var DRAFTS=lsGet("mkh-drafts",{});
  function keepDraft(){if(!S.phone)return;var v=el("box").value;if(v.trim())DRAFTS[S.phone]=v;else delete DRAFTS[S.phone];lsSet("mkh-drafts",DRAFTS)}

  // ---- conversation ----
  function openThread(phone){
    if(S.phone!==phone){keepDraft();resetPolish();el("box").value=DRAFTS[phone]||""}
    S.phone=phone;
    return api("/api/thread?phone="+encodeURIComponent(phone)).then(function(d){
      if(!d||!d.ok||!d.thread)return;
      S.thread=d.thread;show("chat");
      renderHead();
      renderChat(true);sizeBox();updSend();
      if(el("box").value.trim())schedulePolish();
      // Reading it clears the unread dot and the "Mikey answered" pill.
      S.threads.forEach(function(t){if(t.phone===phone)t.unread=0});
      markSeen(phone);badge();
    });
  }
  function renderHead(){
    var t=S.thread;if(!t)return;
    el("chatAv").outerHTML=avHTML(t,"chatAv");
    el("chatName").textContent=who(t);
    el("chatSub").textContent=[carOf(t),t.garage&&t.garage.city].filter(Boolean).join(" · ");
  }
  function nearBottom(){var s=el("scroller");return s.scrollHeight-s.scrollTop-s.clientHeight<120}
  function toBottom(){var s=el("scroller");s.scrollTop=s.scrollHeight}
  function senderOf(m){return m.by||(m.kind&&m.kind!=="manual"?"Automatic":"Mikey")}
  function mediaSrc(t,m,j){
    var it=(m.media||[])[j],u=String((it&&(it.url||it))||"");
    return /^\/i\//.test(u)||/^data:/.test(u)?u:"/api/helper/media?phone="+encodeURIComponent(t.phone)+"&ts="+m.ts+"&n="+j;
  }
  function renderChat(jump){
    var t=S.thread;if(!t)return;
    var stick=jump||nearBottom();
    var info=[],car=carOf(t),addr=t.garage&&t.garage.address;
    if(t.optedOut)info.push('<div class="line warn"><b>Do not text.</b> They replied STOP.</div>');
    if(t.appointmentAt)info.push('<div class="line"><b>Booked:</b> '+esc(fmt(t.appointmentAt,{weekday:"short",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}))+'</div>');
    if(t.helperAsk&&!t.helperAsk.answer)info.push('<div class="line"><b>Waiting on Mikey</b> (asked '+esc(ago(t.helperAsk.at))+' ago): "'+esc(t.helperAsk.question)+'"</div>');
    if(car)info.push('<div class="line"><b>Car:</b> '+esc(car)+'</div>');
    if(addr)info.push('<div class="line"><b>Address:</b> '+esc(addr)+'</div>');
    else if(t.addressGuess)info.push('<div class="line"><b>Address they sent?</b> '+esc(t.addressGuess)+'</div>');
    if(t.notes)info.push('<div class="line">'+esc(t.notes)+'</div>');
    info.push('<div class="line">'+esc(fmtPhone(t.phone))+'</div>');
    el("chatInfo").innerHTML='<div class="info"><div class="ih"><span>Details</span><button id="infoEdit">Edit</button></div>'+info.join("")+'</div>';
    el("infoEdit").onclick=openContact;
    renderOrg();
    // Bubbles group the way a phone groups them: a time header after an hour's
    // gap, tight spacing inside a run from the same side, a tail on the last
    // bubble of each run, and under Mikey's side, who sent that run. Photos and
    // voicemails show in place, like they would on a phone.
    var ms=(t.messages||[]).slice(-150),h="";
    for(var i=0;i<ms.length;i++){
      var m=ms[i],p=ms[i-1],n=ms[i+1],side=m.dir==="out"?"out":"in";
      var newTime=!p||m.ts-p.ts>36e5;
      if(newTime)h+='<div class="stamp">'+esc(stampText(m.ts))+'</div>';
      var endRun=!n||n.dir!==m.dir||n.ts-m.ts>36e5||(side==="out"&&senderOf(n)!==senderOf(m));
      var gap=!newTime&&p&&p.dir!==m.dir;
      var failed=m.status==="failed"||m.status==="undelivered"||m.error;
      (m.media||[]).forEach(function(it,j){
        var type=String((it&&it.type)||"");
        var src=mediaSrc(t,m,j);
        h+='<div class="ph '+side+(gap&&j===0?" gap":"")+'">'+(!type||/^image\//.test(type)
          ?'<img loading="lazy" alt="Photo" src="'+esc(src)+'">'

  // ---- Auto Polish ----
  function strip(kind,html){var s=el("strip");s.className="strip"+(kind?" "+kind:"");s.innerHTML=html}
  function resetPolish(){clearTimeout(P.timer);P.ok="";P.before="";P.seq++;P.busy=false;strip("","")}
  function worth(text){return text.length>=MIN&&text.split(/\s+/).length>=2}
  function schedulePolish(){
    clearTimeout(P.timer);
    var text=el("box").value.trim();
    if(!text){strip("","");return}
    if(text===P.ok)return;
    if(!worth(text)){P.ok=text;strip("","");return}
    strip("","Auto Polish checks it when you pause…");
    P.timer=setTimeout(function(){polishNow()},IDLE);
  }
  function polishNow(){
    var text=el("box").value.trim();
    if(!text||text===P.ok||!S.phone)return;
    if(!worth(text)){P.ok=text;return}
    var my=++P.seq;P.busy=true;strip("pol","✨ Polishing…");
    post("/api/ai/draft",{phone:S.phone,text:text}).then(function(d){
      P.busy=false;
      if(my!==P.seq)return;
      if(el("box").value.trim()!==text)return;       // they kept typing; the next pause catches it
      if(!d||!d.ok||typeof d.draft!=="string"){
        // Polish is a help, not a gate. If it can't run, say so and let them send.
        P.ok=text;strip("warn","Auto Polish is down right now. Read it over once, then send.");return;
      }
      var out=d.draft.trim()||text;
      var note=d.note?'<span>⚠ '+esc(d.note)+'</span>':"";
      if(out!==text){
        P.before=text;el("box").value=out;sizeBox();keepDraft();P.ok=out;
        strip("pol",'✨ Polished to sound like Mikey. Read it, then send. <button id="undoP">Undo</button>'+note);
        el("undoP").onclick=function(){el("box").value=P.before;sizeBox();keepDraft();P.ok=P.before;strip("","Your words are back. Send when ready.")};
      }else{P.ok=text;strip(d.note?"warn":"pol",d.note?note:"✓ Sounds like Mikey.")}
    }).catch(function(){P.busy=false;P.ok=text;strip("warn","Auto Polish couldn't connect. Read it over once, then send.")});
  }
  el("box").oninput=function(){sizeBox();updSend();keepDraft();schedulePolish()};
  // On a computer, Enter sends and Shift+Enter is a new line. On a phone the
  // return key stays a new line, the way texting apps do it.
  el("box").onkeydown=function(e){
    if(e.key==="Enter"&&!e.shiftKey&&window.matchMedia&&window.matchMedia("(pointer:fine)").matches){e.preventDefault();el("sendBtn").click()}
  };

  // Send: if the box isn't what polish last saw, polish first and stop, so the
  // helper reads the version that will actually go out. The second tap sends it.
  el("sendBtn").onclick=function(){
    var text=el("box").value.trim();if(!text||!S.phone||P.busy)return;
    clearTimeout(P.timer);
    if(text!==P.ok){polishNow();return}

  };

    if(note===null)return;
    post("/api/request-date",{phone:S.phone,note:note}).then(function(d){
      if(d&&d.ok){if(d.thread){S.thread=d.thread;renderChat(false)}toast("Mikey's been asked. His answer shows up here.")}else toast("Couldn't reach Mikey. Try again.");
    });
  };
  el("askQ").onclick=function(){
    sheet(false);if(!S.phone)return;
    var q=prompt("What do you need Mikey to decide?","");
    if(q===null||!q.trim())return;
    post("/api/helper/ask",{phone:S.phone,question:q.trim()}).then(function(d){
      if(d&&d.ok){if(S.thread){S.thread.helperAsk=d.helperAsk;renderChat(false)}toast("Sent to Mikey. His answer shows up here.")}else toast("Couldn't reach Mikey. Try again.");
    });
  };

  // ---- guide ----
  function money(n){return n==null||n===""?"":"$"+n}
  function renderGuide(){
    var g=S.guide;if(!g){el("guideBody").innerHTML='<div class="empty">Loading…</div>';return}
    var h="";
    if(g.notes)h+='<div class="notes"><b>From Mikey</b>'+esc(g.notes)+'</div>';
    (g.guide||[]).forEach(function(s,i){
      h+='<h2>'+esc(s.title)+'</h2><ul>'+s.points.map(function(p){return'<li>'+esc(p)+'</li>'}).join("")+'</ul>';
      if(i===1&&(g.prices||[]).length){
        h+='<h2>Price list</h2><table><tr><th>Service</th><th>Car</th><th>SUV</th><th>Truck / XL</th></tr>'+
          g.prices.map(function(p){return'<tr><td>'+esc(p.name)+'</td><td class="n">'+money(p.price.sedan)+'</td><td class="n">'+money(p.price.suv)+'</td><td class="n">'+money(p.price.truck)+'</td></tr>'}).join("")+
          '</table>';
        if((g.addons||[]).length)h+='<ul style="margin-top:10px">'+g.addons.map(function(a){return'<li>'+esc(a.name)+': +'+money(a.price)+'</li>'}).join("")+'</ul>';
        h+='<ul><li>Ceramic coating: from $500, Mikey quotes it.</li><li>Paint correction: Mikey quotes it.</li><li>Rough condition, lots of pet hair or stains can cost more. Ask Mikey before quoting those.</li></ul>';
      }
    });
    h+='<h2>Using this app</h2><ul>'+
      '<li><b>+</b> next to the box: price calculator, Ask Mikey, No reply needed, save their details.</li>'+
      '<li><b>Ask Mikey</b>: his answer shows up in green inside that conversation, and the list shows "Mikey answered".</li>'+
      '<li><b>Schedule</b>: what\'s already booked for the next two weeks.</li>'+
      '<li><b>Organize</b> (top of every chat): stage, labels, the ready-to-book checklist, a follow-up reminder, and notes. Stages and labels filter the list. None of it ever texts the customer.</li>'+
      '<li>Leave a reply half-written and it\'s still there when you come back.</li>'+
      '<li>Add it to your home screen and turn on alerts so your phone buzzes when a customer texts.</li></ul>';
    h+='<h2>Tap-to-use replies</h2>'+(g.quick||[]).map(function(x){return'<div class="q"><b>'+esc(x.label)+'</b>'+esc(x.text)+'</div>'}).join("");
    el("guideBody").innerHTML=h;
  }

  // ---- keep it live ----
  // The list every 15s, an open conversation every 15s, but never while a reply
  // is being written: a re-render mid-thought moves the page under them.
  setInterval(function(){
    if(document.hidden||!S.role)return;
    if(S.view==="list")loadList();
    else if(S.view==="chat"&&S.phone&&!el("box").value.trim()&&!P.busy&&!(el("noteIn")&&el("noteIn").value)&&el("formSheet").classList.contains("hide")){
      api("/api/thread?phone="+encodeURIComponent(S.phone)).then(function(d){
        if(d&&d.ok&&d.thread&&S.view==="chat"&&d.thread.phone===S.phone){S.thread=d.thread;renderChat(false);markSeen(S.phone)}
      });
    }
  },15000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.role&&S.view==="list")loadList()});

  boot();
})();
</script>
</body>
</html>
