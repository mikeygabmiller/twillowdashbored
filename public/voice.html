<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
<title>Voice · Mikey's Detailing</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<!-- app.css is here only for the sign-in screen app.js shows on a 401. Every
     rule below is scoped under .gv, so nothing in it reaches this page. -->
<link rel="stylesheet" href="/app/app.css">
<style>
/* A test of one idea (Mikey, 2026-11-19): his conversations, laid out exactly
   like Google Voice, to see how it feels. The rule for this page is "nothing
   Google Voice doesn't have": no AI chips, no quick replies, no booking pills,
   no "Waiting" tags. If it's not on voice.google.com, it isn't here. The data
   and every send go through the same /api routes as the rest of the dashboard,
   so a text sent here is the same text everywhere.

   Added back since, and only because he uses them (Mikey, 2026-11-19: "add
   back only what I've used"): Polish, scheduled send, and the address found in
   the texts. Then voicemails in the chat, as a card with the transcript and a
   play button (Mikey: "I like when the voicemail shows in chat"). Anything else goes back in the same way, one at a time, when he
   misses it. */
.gv{
  --gv-bg:#fff; --gv-ink:#202124; --gv-ink2:#3c4043; --gv-muted:#5f6368; --gv-line:#dadce0;
  --gv-soft:#f1f3f4; --gv-hover:#f6f8fc; --gv-sel:#e8f0fe; --gv-sel-ink:#1967d2;
  --gv-blue:#1a73e8; --gv-out:#1a73e8; --gv-out-ink:#fff; --gv-in:#f1f3f4; --gv-in-ink:#202124;
  --gv-red:#d93025; --gv-pill:#c2e7ff; --gv-green:#188038; --gv-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
}
@media (prefers-color-scheme: dark){
  .gv{
    --gv-bg:#202124; --gv-ink:#e8eaed; --gv-ink2:#bdc1c6; --gv-muted:#9aa0a6; --gv-line:#3c4043;
    --gv-soft:#303134; --gv-hover:#28292c; --gv-sel:#394457; --gv-sel-ink:#8ab4f8;
    --gv-blue:#8ab4f8; --gv-out:#8ab4f8; --gv-out-ink:#202124; --gv-in:#3c4043; --gv-in-ink:#e8eaed;
    --gv-red:#f28b82; --gv-pill:#004a77; --gv-green:#81c995; --gv-shadow:0 1px 3px rgba(0,0,0,.6);
  }
}
html,body{height:100%}
body{margin:0}
.gv{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--gv-bg);color:var(--gv-ink);
  font:14px/20px Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.2px}
.gv *{box-sizing:border-box}
:where(.gv) :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.gv svg.i{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.gv .ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--gv-muted);flex:none}
.gv .ib:hover{background:var(--gv-soft)}
.gv .ib[disabled]{opacity:.38;cursor:default}

/* ---- top bar (laptop) ---------------------------------------------------- */
.gv-top{height:64px;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;border-bottom:1px solid var(--gv-line);flex:none}
.gv-logo{display:flex;align-items:center;gap:8px;padding-right:56px;font-size:22px;color:var(--gv-muted);white-space:nowrap}
.gv-logo .mark{width:40px;height:40px}
.gv-search{flex:1;max-width:720px;height:48px;border-radius:8px;background:var(--gv-soft);display:flex;align-items:center;gap:4px;padding:0 4px}
.gv-search:focus-within{background:var(--gv-bg);box-shadow:var(--gv-shadow)}
.gv-search input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--gv-ink);font:16px Roboto,Arial,sans-serif;outline:none}
.gv-search input::placeholder{color:var(--gv-muted)}
.gv-top .sp{flex:1}
.gv-me{width:32px;height:32px;border-radius:50%;background:#d93025;color:#fff;display:grid;place-items:center;font-weight:500;font-size:14px;margin:0 8px}

/* ---- body: rail, list, pane --------------------------------------------- */
.gv-body{flex:1;display:flex;min-height:0}
.gv-rail{width:80px;flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:12px}
.gv-rail .nv{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--gv-muted);width:72px}
.gv-rail .nv .pl{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative}
.gv-rail .nv:hover .pl{background:var(--gv-soft)}
.gv-rail .nv.on{color:var(--gv-ink)}
.gv-rail .nv.on .pl{background:var(--gv-pill)}
.gv .bdg{position:absolute;top:0;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--gv-red);color:#fff;font-size:11px;line-height:16px;font-weight:500;padding:0 4px;text-align:center}
.gv .bdg[hidden]{display:none}

.gv-list{width:360px;flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--gv-line)}
.gv-list .scroll{flex:1;overflow-y:auto}
.gv-new{display:flex;align-items:center;gap:16px;height:56px;padding:0 16px;width:100%;text-align:left;font-weight:500;color:var(--gv-ink)}
.gv-new:hover{background:var(--gv-hover)}
.gv-new .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--gv-blue)}
.gv-lh{font-size:14px;font-weight:500;color:var(--gv-muted);padding:12px 16px 4px}
.gv-row{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:8px 16px;text-align:left;border-radius:0 36px 36px 0;margin-right:8px}
.gv-row:hover{background:var(--gv-hover)}
.gv-row.sel{background:var(--gv-sel)}
.gv-row .m{flex:1;min-width:0}
.gv-row .t1{display:flex;align-items:baseline;gap:8px}
.gv-row .nm{flex:1;min-width:0;font-size:14px;color:var(--gv-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv-row .tm{font-size:12px;color:var(--gv-muted);white-space:nowrap}
.gv-row .sn{font-size:14px;color:var(--gv-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.gv-row .sn svg.i{width:16px;height:16px}
.gv-row.unread .nm,.gv-row.unread .sn,.gv-row.unread .tm{font-weight:700;color:var(--gv-ink)}
.gv-row .sn .miss{color:var(--gv-red)}
.gv-row .cb{color:var(--gv-muted)}
.gv-empty{padding:48px 24px;text-align:center;color:var(--gv-muted)}

.gv-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px;font-weight:500;flex:none;overflow:hidden}
.gv-av svg.i{width:28px;height:28px;margin-top:6px}
.gv-av.sm{width:32px;height:32px;font-size:14px}
.gv-av.sm svg.i{width:22px;height:22px;margin-top:4px}

.gv-pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--gv-bg)}
.gv-ph{height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;border-bottom:1px solid var(--gv-line)}
.gv-ph .back{display:none;margin-left:-12px}
.gv-ph .who{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.gv-ph .who b{font-size:16px;font-weight:500;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv-ph .who span{font-size:12px;color:var(--gv-muted);line-height:16px}
.gv-blank{flex:1;display:grid;place-items:center;color:var(--gv-muted);text-align:center;padding:24px}
.gv-blank svg.i{width:96px;height:96px;margin:0 auto 12px;opacity:.25}

/* ---- the conversation ------------------------------------------------------ */
.gv-tl{flex:1;overflow-y:auto;padding:16px 24px 8px;display:flex;flex-direction:column}
.gv-day{align-self:center;font-size:12px;font-weight:500;color:var(--gv-muted);margin:16px 0 8px}
.gv-grp{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.gv-grp.out{flex-direction:row-reverse}
.gv-grp .col{display:flex;flex-direction:column;gap:2px;max-width:min(70%,560px);min-width:0}
.gv-grp.out .col{align-items:flex-end}
.gv-grp.in .col{align-items:flex-start}
.gv-grp .avs{width:32px;flex:none;margin-bottom:22px}
.gv-b{padding:8px 12px;border-radius:18px;font-size:14px;line-height:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.gv-grp.in .gv-b{background:var(--gv-in);color:var(--gv-in-ink)}
.gv-grp.out .gv-b{background:var(--gv-out);color:var(--gv-out-ink)}
.gv-grp.in .gv-b:not(:first-child){border-top-left-radius:4px}
.gv-grp.in .gv-b:not(:last-of-type){border-bottom-left-radius:4px}
.gv-grp.out .gv-b:not(:first-child){border-top-right-radius:4px}
.gv-grp.out .gv-b:not(:last-of-type){border-bottom-right-radius:4px}
.gv-b a{color:inherit}
.gv-img{display:block;max-width:240px;max-height:320px;border-radius:18px;border:1px solid var(--gv-line)}
.gv-meta{font-size:12px;color:var(--gv-muted);margin:2px 4px 0}
.gv-meta .err{color:var(--gv-red)}

.gv-cmp{flex:none;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:4px}
.gv-cmp .fld{flex:1;min-width:0;background:var(--gv-soft);border-radius:24px;display:flex;align-items:flex-end;padding:0 4px 0 16px;min-height:48px}
.gv-cmp textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--gv-ink);font:14px/20px Roboto,Arial,sans-serif;resize:none;outline:none;padding:14px 0;max-height:140px}
.gv-cmp textarea::placeholder{color:var(--gv-muted)}
.gv-cmp .send{color:var(--gv-muted)}
.gv-cmp .send.go{color:var(--gv-blue)}
.gv-att{display:flex;gap:8px;padding:8px 16px 0;flex-wrap:wrap}
.gv-att:empty{display:none}
.gv-att .th{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--gv-soft)}
.gv-att .th img{width:100%;height:100%;object-fit:cover;display:block}
.gv-att .th .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(32,33,36,.8);color:#fff;display:grid;place-items:center}
.gv-att .th .x svg.i{width:14px;height:14px}
.gv-att .th.up::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.5)}
.gv-cmp .pol{color:var(--gv-blue)}
.gv-cmp .pol[hidden],.gv-cmp .sch[hidden]{display:none}
.gv-cmp .pol.busy svg{animation:gvspin 1s linear infinite}
@keyframes gvspin{to{transform:rotate(360deg)}}
.gv-addr{flex:none;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--gv-line);color:var(--gv-ink)}
.gv-addr[hidden]{display:none}
.gv-addr .pin{color:var(--gv-muted)}
.gv-addr .k{flex:1;min-width:0}
.gv-addr .k b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv-addr .k span{display:block;font-size:12px;color:var(--gv-muted)}
.gv-tbtn{height:36px;padding:0 12px;border-radius:18px;color:var(--gv-blue);font-weight:500;white-space:nowrap}
.gv-tbtn:hover{background:var(--gv-soft)}
.gv-tbtn[disabled]{opacity:.5}
.gv-sch{align-self:flex-end;max-width:min(70%,560px);margin-top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.gv-sch .gv-b{background:transparent;color:var(--gv-ink);border:1px dashed var(--gv-muted);cursor:pointer;text-align:left}
.gv-sch .gv-meta{display:flex;align-items:center;gap:4px}
.gv-sch .gv-meta svg.i{width:14px;height:14px}
.gv-dlg{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));background:var(--gv-bg);border-radius:8px;box-shadow:0 2px 6px 2px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.3);padding:24px 24px 8px}
.gv-dlg h2{margin:0 0 16px;font-size:18px;font-weight:400}
.gv-dlg input{width:100%;height:48px;border:1px solid var(--gv-line);border-radius:4px;padding:0 12px;background:var(--gv-bg);color:var(--gv-ink);font:16px Roboto,Arial,sans-serif;color-scheme:light dark}
.gv-dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-bottom:8px}
.gv-snack{display:flex;align-items:center;gap:16px}
.gv-snack button{color:#8ab4f8;font-weight:500;text-transform:none}
.gv-vm{background:var(--gv-in);color:var(--gv-in-ink);border-radius:18px;padding:12px 14px;width:min(320px,100%)}
.gv-vm .hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--gv-muted)}
.gv-vm .hd svg.i{width:18px;height:18px}
.gv-vm .tx{margin-top:6px;font-size:14px;line-height:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.gv-vm .tx.none{color:var(--gv-muted);font-style:italic}
.gv-vm .gv-play{margin-top:10px}
.gv-vm .gv-play .pb{width:36px;height:36px}
.gv-stop{padding:16px;text-align:center;color:var(--gv-muted);font-size:13px;border-top:1px solid var(--gv-line)}

/* New message: the To field */
.gv-to{display:flex;align-items:center;gap:8px;padding:0 16px;height:56px;border-bottom:1px solid var(--gv-line);flex:none}
.gv-to label{color:var(--gv-muted)}
.gv-to input{flex:1;min-width:0;border:0;background:transparent;color:var(--gv-ink);font:14px Roboto,Arial,sans-serif;outline:none;height:100%}
.gv-sugg{flex:1;overflow-y:auto}

/* Calls and voicemail detail */
.gv-det{flex:1;overflow-y:auto;padding:24px}
.gv-det .hero{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:24px}
.gv-det .hero .gv-av{width:72px;height:72px;font-size:32px}
.gv-det .hero .gv-av svg.i{width:48px;height:48px;margin-top:10px}
.gv-det .hero b{font-size:22px;font-weight:400}
.gv-det .hero span{color:var(--gv-muted)}
.gv-det .acts{display:flex;gap:24px;justify-content:center;margin:8px 0 24px}
.gv-det .act{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--gv-blue);font-size:12px;font-weight:500}
.gv-det .act .c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gv-line)}
.gv-det .act:hover .c{background:var(--gv-soft)}
.gv-card{border:1px solid var(--gv-line);border-radius:8px;padding:16px;margin:0 auto 12px;max-width:640px}
.gv-card .hd{display:flex;align-items:center;gap:8px;color:var(--gv-muted);font-size:12px;margin-bottom:8px}
.gv-card .tx{font-size:14px;line-height:22px;color:var(--gv-ink)}
.gv-card .tx.none{color:var(--gv-muted);font-style:italic}
.gv-cl{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--gv-line);max-width:640px;margin:0 auto}
.gv-cl:last-child{border-bottom:0}
.gv-cl .k{flex:1}
.gv-cl .k div:last-child{font-size:12px;color:var(--gv-muted)}
.gv-cl .miss{color:var(--gv-red)}
.gv-play{display:flex;align-items:center;gap:12px;margin-top:12px}
.gv-play .pb{width:40px;height:40px;border-radius:50%;background:var(--gv-blue);color:var(--gv-bg);display:grid;place-items:center;flex:none}
.gv-play .bar{flex:1;height:4px;border-radius:2px;background:var(--gv-line);position:relative;cursor:pointer}
.gv-play .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--gv-blue);width:0}
.gv-play .tt{font-size:12px;color:var(--gv-muted);font-variant-numeric:tabular-nums;min-width:72px;text-align:right}

/* ---- menus, drawer, snackbar ------------------------------------------- */
.gv-menu{position:fixed;z-index:60;min-width:200px;background:var(--gv-bg);border-radius:4px;box-shadow:0 2px 6px 2px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.3);padding:8px 0}
.gv-menu button{display:block;width:100%;text-align:left;padding:0 16px;height:40px;line-height:40px;font-size:14px;color:var(--gv-ink)}
.gv-menu button:hover{background:var(--gv-soft)}
.gv-scrim{position:fixed;inset:0;z-index:55;background:transparent}
.gv-scrim.dim{background:rgba(32,33,36,.5)}
.gv-drawer{position:fixed;top:0;left:0;bottom:0;z-index:58;width:280px;max-width:85vw;background:var(--gv-bg);box-shadow:var(--gv-shadow);padding:8px 12px 0 0;display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .2s}
.gv-drawer.on{transform:none}
.gv-drawer .hd{display:flex;align-items:center;gap:8px;height:56px;padding-left:16px;font-size:22px;color:var(--gv-muted);margin-bottom:8px}
.gv-drawer .hd .mark{width:40px;height:40px}
.gv-drawer .it{display:flex;align-items:center;gap:20px;height:48px;padding:0 16px 0 24px;border-radius:0 24px 24px 0;font-weight:500;color:var(--gv-ink2);width:100%;text-align:left}
.gv-drawer .it svg.i{color:var(--gv-muted)}
.gv-drawer .it:hover{background:var(--gv-soft)}
.gv-drawer .it.on{background:var(--gv-sel);color:var(--gv-sel-ink)}
.gv-drawer .it.on svg.i{color:var(--gv-sel-ink)}
.gv-drawer hr{border:0;border-top:1px solid var(--gv-line);margin:8px 0}
.gv-snack{position:fixed;z-index:70;left:50%;bottom:24px;transform:translate(-50%,24px);opacity:0;pointer-events:none;background:#323232;color:#fff;border-radius:4px;padding:14px 16px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px rgba(0,0,0,.14);transition:opacity .15s,transform .15s}
.gv-snack.on{opacity:1;transform:translate(-50%,0)}

/* ---- the phone layout: the Google Voice app ------------------------------ */
.gv-bnav,.gv-fab,.gv-msearch{display:none}
@media (max-width:899px){
  .gv-top,.gv-rail{display:none}
  .gv-list{width:100%;border-right:0}
  .gv-msearch{display:flex;align-items:center;gap:4px;margin:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;height:48px;border-radius:24px;background:var(--gv-soft);padding:0 4px;flex:none}
  .gv-msearch input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--gv-ink);font:16px Roboto,Arial,sans-serif;outline:none}
  .gv-msearch input::placeholder{color:var(--gv-muted)}
  .gv-new{display:none}
  .gv-row{border-radius:0;margin-right:0}
  .gv-bnav{display:flex;flex:none;height:calc(80px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--gv-soft)}
  .gv-bnav .nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--gv-muted)}
  .gv-bnav .nv .pl{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative}
  .gv-bnav .nv.on{color:var(--gv-ink)}
  .gv-bnav .nv.on .pl{background:var(--gv-pill)}
  .gv-fab{display:flex;position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:20;height:56px;padding:0 20px 0 16px;border-radius:16px;align-items:center;gap:12px;background:var(--gv-pill);color:var(--gv-ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15)}
  .gv-fab[hidden]{display:none}
  .gv-pane{position:fixed;inset:0;z-index:30;transform:translateX(100%);transition:transform .2s ease}
  .gv.open .gv-pane{transform:none}

    if (S.view === "messages") h += '<button class="gv-new" id="newBtn"><span class="c">'+ic("add")+'</span>Send new message</button>';

// What shows in a text thread: texts, photos and voicemails. Voice keeps

function renderThread(first){

function bindComposer(){

// Shrunk in the browser before it goes, the same as the main app's photos: a
// 4 MB camera photo isn't something a carrier will deliver as a text.
function compress(file){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var w = img.width, h = img.height, edge = 1400, q = .74, out = "";
      for (var pass = 0; pass < 6; pass++) {
        var sc = Math.min(1, edge / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w*sc)); c.height = Math.max(1, Math.round(h*sc));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length <= 440000) break;
        if (q > .44) q -= .12; else edge = Math.round(edge * .75);
      }

    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}

    compress(f).then(function(data){
      a.preview = data; renderAtt();
      return A.post("/api/send-photo", { data:data, type:"image/jpeg", name:f.name });
    }).then(function(d){

function send(){
  var box = el("msg"), phone = S.phone;

// ---- Polish ---------------------------------------------------------------------
// The same call the dashboard's Polish makes. It rewrites the box in place and

function polish(){

  var text = box && box.value.trim(); if (!text || !phone || btn.classList.contains("busy")) return;
  btn.classList.add("busy");
  A.post("/api/ai/draft", { phone:phone, text:text }).then(function(d){
    btn.classList.remove("busy");

// ---- Scheduled send ------------------------------------------------------------
// The dashboard's quick times, then a picker for anything else.

  to.addEventListener("input", sugg);
  to.addEventListener("keydown", function(e){ if (e.key === "Enter") { var n = e164(to.value); if (n) openThread(n, true); } });
  el("sugg").onclick = function(e){ var b = e.target.closest("[data-to]"); if (b) openThread(b.dataset.to, true); };
}
function dialer(){
  closePop();
  S.pane = "dial"; S.phone = null;
  el("pane").innerHTML = '<div class="gv-ph"><button class="ib back" id="paneBack" aria-label="Back">'+ic("back")+'</button><div class="who"><b>Make a call</b></div></div>'+
    '<div class="gv-to"><input id="to" type="tel" inputmode="tel" placeholder="Enter a name or number" autocomplete="off"><button class="ib" id="dialGo" aria-label="Call">'+ic("call")+'</button></div>'+
    '<div class="gv-sugg" id="sugg"></div>';
  el("paneBack").onclick = function(){ blankPane(); renderList(); };
  showPane();
  var to = el("to"); to.focus();
  function go(n){ if (n) callOut(n); else snack("Enter a valid phone number"); }
  el("dialGo").onclick = function(){ go(e164(to.value)); };
  to.addEventListener("keydown", function(e){ if (e.key === "Enter") go(e164(to.value)); });
  to.addEventListener("input", function(){
    var v = to.value.trim().toLowerCase();
    el("sugg").innerHTML = S.rows.filter(function(r){ return v && [r.name, r.phone, A.fmtPhone(r.phone)].join(" ").toLowerCase().indexOf(v) >= 0; }).slice(0, 8).map(function(r){
      return '<button class="gv-row" data-to="'+esc(r.phone)+'">'+av(r.phone, r.name)+'<span class="m"><span class="nm">'+esc(A.displayName(r))+'</span><span class="sn">'+esc(A.fmtPhone(r.phone))+'</span></span></button>';
    }).join('');
  });
  el("sugg").onclick = function(e){ var b = e.target.closest("[data-to]"); if (b) callOut(b.dataset.to); };
}

// ---- a call or a voicemail --------------------------------------------------------
function fmtSec(s){ s = Math.max(0, Math.round(s || 0)); return Math.floor(s/60) + ":" + String(s % 60).padStart(2, "0"); }
function callById(id){ for (var i=0;i<S.calls.length;i++) if (String(S.calls[i].id) === String(id)) return S.calls[i]; return null; }
function openCall(id, doPush){
  closePop();
  var c = callById(id); if (!c) return;
  S.pane = S.view; S.callId = c.id; S.phone = c.fromNorm;
  if (doPush) push({ gv:1, v:S.view, k:c.id }, "?" + (S.view === "voicemail" ? "vm" : "call") + "=" + encodeURIComponent(c.id));
  var phone = c.fromNorm, n = nameFor(phone), h = paneHead(phone, { more:false });
  h += '<div class="gv-det"><div class="hero">'+av(phone, n)+'<b>'+esc(n || A.fmtPhone(phone))+'</b>'+(n ? '<span>'+esc(A.fmtPhone(phone))+'</span>' : '')+'</div>'+
    '<div class="acts"><button class="act" id="dCall"><span class="c">'+ic("call")+'</span>Call</button><button class="act" id="dMsg"><span class="c">'+ic("chat")+'</span>Message</button></div>';
  if (S.view === "voicemail") {
    h += S.calls.filter(function(x){ return x.fromNorm === phone && x.outcome === "voicemail"; }).map(function(v){
      return '<div class="gv-card"><div class="hd">'+ic("voicemail")+esc(new Date(v.ts).toLocaleDateString([], { weekday:"short", month:"short", day:"numeric" }) + ", " + A.clock(v.ts))+'</div>'+
        (v.transcript ? '<div class="tx">'+esc(v.transcript)+'</div>' : '<div class="tx none">'+(v.transcriptFailed ? 'Transcript not available' : 'Transcribing…')+'</div>')+
        (v.recording ? player(v.recording, v.vmSec) : '')+'</div>';
    }).join('');
  } else {
    // A call's page in Voice is that person's call history, newest first.
    h += S.calls.filter(function(x){ return x.fromNorm === phone && CALL_KINDS[x.outcome]; }).map(function(x){
      var len = x.talkSec ? fmtSec(x.talkSec) : (x.vmSec ? fmtSec(x.vmSec) : "");
      return '<div class="gv-cl">'+callIcon(x)+'<div class="k"><div>'+esc(callWord(x))+(len ? ' · '+len : '')+'</div><div>'+esc(new Date(x.ts).toLocaleDateString([], { weekday:"short", month:"short", day:"numeric" }) + ", " + A.clock(x.ts))+'</div></div></div>'+
        (x.recording && x.outcome !== "voicemail" ? player(x.recording, x.talkSec || x.recSec) : '');
    }).join('');
  }
  h += '</div>';
  el("pane").innerHTML = h;
  bindHead(phone);
  el("dCall").onclick = function(){ callOut(phone); };
  el("dMsg").onclick = function(){ openThread(phone, true); };
  bindPlayers();
  showPane(); renderList();
}
function player(rec, secs){
  return '<div class="gv-play" data-src="/api/media?u='+esc(encodeURIComponent(rec))+'"><button class="pb" aria-label="Play">'+ic("play")+'</button>'+
    '<span class="bar"><i></i></span><span class="tt">0:00 / '+fmtSec(secs)+'</span></div>';
}
function bindPlayers(root){
  (root || document).querySelectorAll(".gv-play").forEach(function(p){
    var au = null, btn = p.querySelector(".pb"), bar = p.querySelector(".bar"), fill = bar.querySelector("i"), tt = p.querySelector(".tt");
    function tick(){ if (!au) return; var d = au.duration || 0; fill.style.width = (d ? au.currentTime / d * 100 : 0) + "%"; tt.textContent = fmtSec(au.currentTime) + " / " + fmtSec(d); }
    function make(){
      if (au) return au;
      au = new Audio(p.dataset.src);
      au.addEventListener("timeupdate", tick); au.addEventListener("loadedmetadata", tick);
      au.addEventListener("play", function(){ btn.innerHTML = ic("pause"); btn.setAttribute("aria-label","Pause"); });
      au.addEventListener("pause", function(){ btn.innerHTML = ic("play"); btn.setAttribute("aria-label","Play"); });
      au.addEventListener("ended", function(){ btn.innerHTML = ic("play"); });
      au.addEventListener("error", function(){ snack("Couldn't play this recording"); });
      return au;
    }
    btn.onclick = function(){ var a = make(); if (a.paused) a.play().catch(function(){}); else a.pause(); };
    bar.onclick = function(e){ var a = make(), r = bar.getBoundingClientRect(); if (a.duration) a.currentTime = (e.clientX - r.left) / r.width * a.duration; };
  });
}

// ---- start ------------------------------------------------------------------
function route(first){
  var q = location.search, m;
  if ((m = q.match(/[?&]c=([^&#]+)/))) return openThread(decodeURIComponent(m[1]), false);
  if ((m = q.match(/[?&](vm|call)=([^&#]+)/))) { setView(m[1] === "vm" ? "voicemail" : "calls", true); return openCall(decodeURIComponent(m[2]), false); }
  if (!first) { blankPane(); renderList(); }
}
setView("messages");
Promise.all([loadList(), loadCalls()]).then(function(){
  if (/[?&](c|vm|call)=/.test(location.search)) { try { history.replaceState({ gv:1 }, "", location.href); } catch(e){} }
  route(true);
});
// Fresh without a refresh, at the same pace as the main Inbox.
setInterval(function(){ if (!document.hidden) loadList(); }, 20000);
setInterval(function(){ if (!document.hidden) pollThread(); }, 8000);
setInterval(function(){ if (!document.hidden) loadCalls(); }, 60000);
})();
</script>
