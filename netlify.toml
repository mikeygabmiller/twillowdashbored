[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Route the public webhook paths and the dashboard API to the single function.
# status = 200 makes these rewrites (the function still sees the original path),
# so /api/health, /sms, /submit, etc. all reach netlify/functions/api.mjs.
[[redirects]]
  from = "/submit"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/sms"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/call"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/voicemail"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/voicemail-done"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
