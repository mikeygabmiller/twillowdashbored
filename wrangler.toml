# Mikey's Detailing — SMS dashboard, Cloudflare Worker.
# Deploy:  npx wrangler deploy
# This replaces the Netlify deploy. Cloudflare's free tier is request-based
# (100k req/day) with no credit system that pauses production deploys.

name = "texting"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Serve the dashboard UI (public/index.html) as static assets. Requests that
# match a static file are served directly; everything else hits the Worker
# (the /submit, /sms, /call and /api/* routes).
[assets]
directory = "./public"

# Public origin the Worker is reachable at. Used to build the absolute Twilio
# StatusCallback URL on cron-time sends (scheduled sends + auto follow-ups), where
# there's no incoming request to derive it from. Request-time sends detect this
# automatically; set it here so delivery-failure tracking also covers the cron.
[vars]
PUBLIC_BASE_URL = "https://texting.mikeysdetailingsnohomish.workers.dev"

# NOTE (2026-08-25): the two mails that went out EVERY day — the morning brief and
# the evening "log today's money?" nudge — are paused. It's an in-app switch, not a
# var: ☰ → Settings → Phone notifications → Daily emails. Weekly recap, monthly
# close-out and anything a customer sets off are unaffected.
#
# Owner alerts (new leads, missed calls, voicemails, follow-up nudges) go out as
# EMAIL instead of a Twilio SMS whenever RESEND_API_KEY (secret, below) AND
# ALERT_EMAIL are both set — see notifyMikey() in src/index.js. Keeps self-alerts
# off the Twilio bill. The default sender (onboarding@resend.dev) delivers to your
# own Resend account email right away; verify a domain later for a custom From.
ALERT_EMAIL = "mikeysdetailing4u@gmail.com"

# Conversation storage. Reuses the MESSAGES namespace already on the account.
[[kv_namespaces]]
binding = "MESSAGES"
id = "e3305474d22a48ac97265b394aba685e"

# Minute cron (scheduled() handler): delivers due scheduled sends (delayed auto-
# replies, appointment reminders, the 3.5-min first reach-out) AND advances the
# auto follow-up engine (surfaces nudges, fires autopilot sends). Well within the
# free tier (~1,440 runs/day vs 100k/day); the engine uses the thread index's
# cached next-due time to only load conversations that actually need action.
#
# EMERGENCY STOP (no deploy, no KV write needed):
#   - Kill the follow-up engine only: dashboard → Worker → Settings → Variables,
#     add  FOLLOWUPS_DISABLED = 1  (honored by evaluateFollowups; scheduled sends
#     keep working). Remove it to resume.
#   - Stop ALL cron work: dashboard → Worker → Settings → Triggers, delete the
#     cron below. A later `wrangler deploy` re-creates it from this file.
#   - Twilio webhook signature enforcement is OPT-IN and OFF by default so a deploy
#     can't drop real inbound texts. Turn it ON with  TWILIO_SIGNATURE_ENFORCE = 1
#     under Variables (validated with your existing TWILIO_AUTH_TOKEN — no new secret).
#     Remove the var to instantly go back to accept-all if webhooks ever stop arriving.
#   - Stop counting what the AI costs (per-surface token counters, ~1 KV write per
#     8 AI calls): add  AI_USAGE_OFF = 1  under Variables. The AI itself keeps
#     working; only the /api/ai/usage numbers stop moving.
#   - Kill appointment detection + the day-of briefs only: add  DAYOF_DISABLED = 1
#     under Variables. Texting, follow-ups and scheduled sends all keep working.
#     Remove it to resume. (The in-app master switch does the same thing, but it
#     writes to KV — this one works even when the daily write budget is spent.)
[triggers]
crons = ["* * * * *"]

# Secrets (set once, not stored here):
#   npx wrangler secret put TWILIO_ACCOUNT_SID
#   npx wrangler secret put TWILIO_AUTH_TOKEN
#   npx wrangler secret put TWILIO_FROM
#   npx wrangler secret put MIKEY_PHONE
#   npx wrangler secret put GEMINI_API_KEY   # optional, for the AI features
#   npx wrangler secret put RESEND_API_KEY   # optional — sends owner alerts as email (with ALERT_EMAIL above) instead of texting yourself

# Dashboard click-to-call rings CALL_BRIDGE_PHONE (defaults to +14252321355 in
# src/index.js) and then bridges to the customer. It is separate from MIKEY_PHONE
# on purpose — alerts and inbound call forwarding still go to MIKEY_PHONE. To ring
# a different handset without a deploy, add CALL_BRIDGE_PHONE under Variables.
