# Matins — daily Catholic devotional Worker.
#
#   npx wrangler deploy        deploy
#   npx wrangler dev           local
#   npm run preview 2026-08-05 dry run, sends nothing (no wrangler needed)
#
# Secrets are NEVER set here. Set them with `wrangler secret put <NAME>`:
#   LLM_API_KEY, RESEND_API_KEY, TOKEN_SECRET, GITHUB_TOKEN, ADMIN_TOKEN

name = "matins"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
APP_NAME = "Matins"
# Local hour of day the issue is built and sent (0-23), in SEND_TZ.
SEND_HOUR = "5"
SEND_TZ = "America/Los_Angeles"
# "anthropic" | "gemini" | "stub" (stub = deterministic offline text, never calls out)
LLM_PROVIDER = "gemini"
# Blank uses the provider default (gemini-3.6-flash / claude-sonnet-5). Model
# names go stale — GET /admin/models lists what your key can actually reach.
# If the API 404s on the default, put a current name here.
LLM_MODEL = ""
# Gemini reasons before answering and those tokens come out of the same output
# budget as the answer. None of this work needs deliberation — a six-sentence
# reflection, a nine-word headline, a two-field verdict — and leaving it on cost
# eight issues their reflection and saint story, truncated mid-sentence. "0"
# turns it off. Blank sends no thinking field at all (the pre-2026-08 behaviour,
# and the bug). Only set it blank if the API rejects the field outright — and it
# now retries without it by itself if that happens.
GEMINI_THINKING_BUDGET = "0"
# Where to send the "today's issue went out thin" alert. Leave empty for none.
# Nothing else reads it; it is not a subscriber and never goes on the list.
ALERT_EMAIL = ""
# "1" lets an UNAUTHENTICATED /admin/* error report which binding names reached
# this Worker and whether a supplied token is the right length. That is worth an
# evening while the Worker is being wired up and worth nothing afterwards, so it
# ships off. Turn it on, diagnose, turn it off — it also needs ?debug=1.
ADMIN_DIAGNOSTICS = "0"
# Resend's shared sender needs no DNS and delivers ONLY to your own Resend
# account address — right for a first look, useless for real subscribers.
# Verify a domain in Resend and change this before anyone else signs up.
FROM_EMAIL = "Matins <onboarding@resend.dev>"
REPLY_TO = ""
SITE_URL = "https://mikeygabmiller.github.io/matins"
# This Worker's own origin. Request-time routes detect it automatically; the
# cron has no request to read it from, so confirm/unsubscribe links and the
# published signup form use this. Must match the deployed Worker URL.
WORKER_URL = "https://matins.mikeysdetailingsnohomish.workers.dev"
CALENDAR_LOCALE = "en-US"
READINGS_API_BASE = "https://cpbjr.github.io/catholic-readings-api"
# Optional public-domain Douay-Rheims text source for the verse of the day.
# Leave empty to print the reference only (never generated by the LLM).
DR_API_BASE = "https://bible-api.com"
# GitHub Pages repo the web archive is committed to.
SITE_REPO = "mikeygabmiller/matins"
SITE_BRANCH = "main"
# "1" builds and publishes without emailing. Back to "1" on 2026-08-21 together
# with the cron below: with no cron there is nothing to pause, but a hand-run
# POST /admin/run defaults to send=1, so this is what stops an admin call made
# to look at the writing from also mailing the whole confirmed list while the
# daily is off. Set to "0" in the same change that restores the cron.
SEND_PAUSED = "1"

# Subscribers, issue archive, rotation state. Create with:
#   npx wrangler kv namespace create DEVOTIONAL
[[kv_namespaces]]
binding = "DEVOTIONAL"
id = "2469221591314033a84969f0f5815e69"

# Daily build + send — PAUSED 2026-08-21, to stop the Gemini spend.
#
# The cron is what had to go, not just the send. Every morning's build makes
# roughly a dozen model calls — the reflection and the saint story are drafted
# twice and the headline three times, each draft is judged for craft, and every
# generated block then goes through a second safety call — so pausing delivery
# alone would have left the whole bill in place for an issue nobody received.
#
# An empty list is the off switch. `wrangler deploy` deletes every cron trigger
# on the Worker when it reads this; deleting the [triggers] block outright is
# the thing that does NOT work, because the live triggers would simply stay as
# they are. Nothing is lost by pausing: the archive and the subscriber list sit
# in KV untouched, and the Worker keeps serving signup, confirm, unsubscribe
# and the archive routes.
#
# TO RESUME: put the two crons back (the line below), set SEND_PAUSED = "0"
# above, then deploy. Both are UTC and both are meant to be there — the handler
# re-checks local time and does nothing outside SEND_HOUR, so 12:00 UTC fires
# at 5am PDT and skips in winter, 13:00 UTC fires at 5am PST and skips in
# summer, and the daylight-saving shift never costs a morning or doubles one.
#
#   crons = ["0 12 * * *", "0 13 * * *"]
#
# Until it is deployed this file has changed nothing. To stop the sends right
# now without a deploy: Cloudflare dashboard → Workers → matins → Settings →
# Triggers → delete both cron triggers.
[triggers]
crons = []

# NOTE: ./site is the GitHub Pages source, not Worker assets. The Worker
# renders its own signup and notice pages, so nothing is bound here — that
# keeps a stale built page from shadowing a live route.
