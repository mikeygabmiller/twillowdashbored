<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Archive · Matins</title>
<meta name="description" content="Every issue of Matins, a daily Catholic devotional.">
<link rel="canonical" href="https://mikeygabmiller.github.io/matins/archive/">
<meta property="og:title" content="Archive · Matins">
<meta property="og:description" content="Every issue of Matins, a daily Catholic devotional.">
<meta property="og:type" content="article">
<meta property="og:url" content="https://mikeygabmiller.github.io/matins/archive/">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#F4EEE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0C09" media="(prefers-color-scheme: dark)">
<link rel="icon" href="https://mikeygabmiller.github.io/matins/mark.svg" type="image/svg+xml">
<style>
  :root {
    --accent:#3E6B4B; --tint:#EDF2ED;
    --paper:#FBF7EF; --paper-alt:#F4EEE2;
    --ink:#241F1A; --ink-soft:#5C5449; --rule:#DDD3C2;
    --shadow:0 1px 2px rgba(36,31,26,.04), 0 8px 28px rgba(36,31,26,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent:#82B891; --tint:#1A241C;
      --paper:#17140F; --paper-alt:#0E0C09;
      --ink:#EFE7DA; --ink-soft:#A99E8C; --rule:#332E27;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper-alt);color:var(--ink);font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'Times New Roman', serif;line-height:1.72;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:672px;margin:0 auto;padding:28px 18px 64px}
  .sheet{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:0 0 30px;box-shadow:var(--shadow);overflow:hidden}
  /* The liturgical colour of the day, before a word is read. */
  .band{height:5px;background:var(--accent)}
  .inner{padding:30px 34px 0}
  /* ~66 characters to the line: the single biggest thing for reading comfort. */
  .inner > p, .inner > blockquote, .inner > .action, .inner > .prayer, .inner > .note{max-width:38em}
  header.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
  header.brand a{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
  .wordmark{font-size:22px;letter-spacing:.14em;text-transform:uppercase}
  .eyebrow{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  h1{font-weight:400;font-size:clamp(27px,5vw,35px);line-height:1.22;margin:.3em 0 .5em;max-width:22ch}
  /* Not flex: the dot has to sit on the first line of the text and let the
     text wrap under itself, which flex will not do once the line is long. */
  .daybar{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13.5px;line-height:1.6;color:var(--ink-soft)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:8px}
  .hdo{color:var(--accent);font-weight:700}
  hr{border:0;border-top:1px solid var(--rule);margin:24px 0}
  /* Section head: a rule, then the label. The rule is what makes the page
     scannable — it is the only thing separating one section from the next. */
  h2{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 12px;padding-top:28px;border-top:1px solid var(--rule);line-height:1.4}
  h2:first-of-type{border-top:0;padding-top:0}
  h2 + .note{margin:-8px 0 12px}
  p{font-size:17.5px;margin:0 0 15px}
  a{color:var(--accent);text-underline-offset:2px}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
  .readings{width:auto;border-collapse:collapse;margin:0 0 14px}
  .readings th{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);text-align:left;font-weight:600;padding:0 18px 8px 0;white-space:nowrap;vertical-align:baseline}
  .readings td{padding:0 0 8px 0;font-size:16.5px;line-height:1.45;vertical-align:baseline}
  .usccb{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:14.5px;font-weight:600}
  blockquote{margin:0;border-left:3px solid var(--accent);padding-left:18px;font-style:italic}
  blockquote p{font-size:19.5px;line-height:1.62;margin-bottom:10px}
  .cite{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-style:normal;font-size:12px;color:var(--ink-soft)}
  .action{background:var(--tint);border-radius:9px;padding:16px 18px;margin:6px 0 0}
  .action .label{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
  .action p{font-size:16.5px;margin:0}
  /* A prayer is said, not skimmed: one line per line, hanging indent on wrap. */
  .prayer{margin:0 0 15px}
  .prayer .stanza{margin:0 0 14px}
  .prayer .stanza:last-child{margin-bottom:0}
  .prayer .line{font-size:17.5px;line-height:1.58;padding-left:15px;text-indent:-15px;margin:0}
  .prayer-title{font-size:21px;line-height:1.3;margin:0 0 6px}
  .question{font-size:20px;line-height:1.4;margin:0 0 12px}
  .note{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;font-style:italic;color:var(--ink-soft);margin:0 0 16px;line-height:1.6}
  nav.issue-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13.5px;margin-top:34px;padding-top:20px;border-top:1px solid var(--rule)}
  nav.issue-nav a{text-decoration:none;padding:7px 13px;border:1px solid var(--rule);border-radius:999px;color:var(--ink)}
  nav.issue-nav a:hover{border-color:var(--accent);color:var(--accent)}
  nav.issue-nav .spacer{flex:1}
  footer{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;color:var(--ink-soft);margin-top:26px;padding-top:18px;border-top:1px solid var(--rule);line-height:1.8}
  ul.archive{list-style:none;margin:0;padding:0}
  ul.archive li{border-bottom:1px solid var(--rule);padding:13px 0}
  ul.archive li:last-child{border-bottom:0}
  ul.archive .row{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  ul.archive time{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;color:var(--ink-soft);min-width:58px;flex:none}
  ul.archive a{text-decoration:none;font-size:18px;line-height:1.4}
  ul.archive a:hover{text-decoration:underline}
  ul.archive .feast{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12.5px;color:var(--ink-soft);margin:2px 0 0 88px;line-height:1.5}
  h3.month{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin:28px 0 6px}
  h3.month:first-of-type{margin-top:8px}
  .swatch{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;flex:none}
  form.signup{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 8px;max-width:38em}
  form.signup input{flex:1 1 240px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;padding:13px 15px;border:1px solid var(--rule);border-radius:9px;background:var(--paper-alt);color:var(--ink)}
  form.signup input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  form.signup button{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;font-weight:600;padding:13px 24px;border:0;border-radius:9px;background:var(--accent);color:var(--paper);cursor:pointer}
  form.signup button:hover{filter:brightness(1.08)}
  .msg{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:14px;margin-top:10px;color:var(--ink-soft)}
  @media (max-width:540px){
    .inner{padding:24px 21px 0}
    h2{padding-top:24px}
    /* The spacers only make sense while the row fits on one line. */
    nav.issue-nav{gap:8px}
    nav.issue-nav .spacer{display:none}
    nav.issue-nav a{padding:7px 11px}
    ul.archive .feast{margin-left:0}
  }
  @media print{
    :root{--paper:#fff;--paper-alt:#fff;--ink:#000;--ink-soft:#444;--rule:#ccc;--shadow:none}
    .wrap{max-width:none;padding:0}
    .sheet{border:0;border-radius:0;box-shadow:none}
    .band,nav.issue-nav,form.signup{display:none}
    a{color:inherit;text-decoration:none}
  }
</style>

</head>
<body>
<div class="wrap">
  <div class="sheet">
    <div class="band"></div>
    <div class="inner">
      <header class="brand">
        <a href="https://mikeygabmiller.github.io/matins/"><svg width="30" height="30" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Matins mark">
  <path d="M20 7c6.6 0 12 5.4 12 12v14H8V19C8 12.4 13.4 7 20 7z" fill="var(--accent)" fill-opacity="0.12"/>
  <path d="M20 7c6.6 0 12 5.4 12 12v14H8V19C8 12.4 13.4 7 20 7z" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M12 33V21.5a8 8 0 0 1 16 0V33" stroke="var(--accent)" stroke-width="1.2" stroke-opacity="0.55"/>
  <circle cx="20" cy="21.5" r="4.2" fill="var(--accent)" fill-opacity="0.9"/>
  <path d="M4 33h32" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/>
</svg><span class="wordmark">Matins</span></a>
      </header>
      <div class="eyebrow">Archive</div><h1>Every issue</h1>
      <div class="daybar"><span>Nothing here yet</span></div>
      <hr>
      <p>The first issue has not gone out yet.</p>
      
      <footer>
        <a href="https://mikeygabmiller.github.io/matins/archive/">Archive</a> &middot;
        <a href="https://mikeygabmiller.github.io/matins/">Subscribe</a><br>
        Made by a young Catholic in Snohomish County, Washington.
      </footer>
    </div>
  </div>
</div>
</body>
</html>
